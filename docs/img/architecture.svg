<circle cx="1015" cy="71" r="11" fill="#5b6b78"/>
<text x="1015" y="75.5" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="1037" y="76" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">You open the page: the browser sends HTTPS</text>
<text x="1037" y="96" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">to Traefik.</text>
<circle cx="1015" cy="121" r="11" fill="#5b6b78"/>
<text x="1015" y="125.5" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="1037" y="126" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">Traefik ends TLS and forwards plain HTTP</text>
<text x="1037" y="146" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">to Service kubemap.</text>
<circle cx="1015" cy="171" r="11" fill="#5b6b78"/>
<text x="1015" y="175.5" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="1037" y="176" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">Service kubemap hands the request to the</text>
<text x="1037" y="196" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">Server pod.</text>
<circle cx="1015" cy="221" r="11" fill="#5b6b78"/>
<text x="1015" y="225.5" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="1037" y="226" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">The Server asks the in-process cluster</text>
<text x="1037" y="246" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">agent for data.</text>
<circle cx="1015" cy="271" r="11" fill="#5b6b78"/>
<text x="1015" y="275.5" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="1037" y="276" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">The agent reads the Kubernetes API server</text>
<text x="1037" y="296" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">(get, list, watch) with a read-only</text>
<text x="1037" y="316" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">ServiceAccount, and checks node agent</text>
<text x="1037" y="336" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">tokens with TokenReview. There is no write</text>
<text x="1037" y="356" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">path.</text>
<circle cx="1015" cy="381" r="11" fill="#5b6b78"/>
<text x="1015" y="385.5" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="1037" y="386" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">The Server keeps sessions, audit log and</text>
<text x="1037" y="406" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">journal in SQLite on PVC kubemap-data.</text>
<circle cx="1015" cy="431" r="11" fill="#5b6b78"/>
<text x="1015" y="435.5" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<text x="1037" y="436" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">Each node agent sends its node&#x27;s disk,</text>
<text x="1037" y="456" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">memory and kubelet metrics every 10 s over</text>
<text x="1037" y="476" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">WebSocket to Service kubemap, with its</text>
<text x="1037" y="496" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">ServiceAccount token.</text>
<circle cx="1015" cy="521" r="11" fill="#5b6b78"/>
<text x="1015" y="525.5" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">8</text>
<text x="1037" y="526" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">The Server queries Prometheus and Tempo,</text>
<text x="1037" y="546" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">read-only, for the Monitor panel.</text>
<rect x="1000" y="580" width="375" height="78" rx="10" fill="#fff" stroke="#c9d3da"/>
<text x="1015" y="604" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1d2b36" text-anchor="start">Key idea</text>
<text x="1015" y="626" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">Kubemap runs inside the cluster it shows</text>
<text x="1015" y="646" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1d2b36" text-anchor="start">and can only read it.</text>
