# Kubemap install manifest (generated by `kubemap-agent bundle`; do not edit).
# Image localhost/kubemap:dev.
# Read-only by design: the server's ClusterRole has get, list and watch only.
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/managed-by: kubemap
    pod-security.kubernetes.io/enforce: restricted
  name: kubemap-system
spec: {}
status: {}
