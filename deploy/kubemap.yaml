apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/managed-by: kubemap
    app.kubernetes.io/name: kubemap-data
    app.kubernetes.io/part-of: kubemap
  name: kubemap-data
  namespace: kubemap-system
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
status: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kubemap
    app.kubernetes.io/name: kubemap
    app.kubernetes.io/part-of: kubemap
  name: kubemap
  namespace: kubemap-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubemap
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubemap
    spec:
      containers:
      - args:
        - run
        - -listen
        - :8080
        - -data-dir
        - /data/kubemap
        command:
        - /usr/local/bin/kubemap-portal
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: localhost/kubemap:dev
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        name: kubemap
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        resources:
          limits:
            memory: 384Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kubemap
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kubemap-data
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
status: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kubemap
    app.kubernetes.io/name: kubemap
    app.kubernetes.io/part-of: kubemap
  name: kubemap
  namespace: kubemap-system
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app.kubernetes.io/name: kubemap
status:
  loadBalancer: {}
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/managed-by: kubemap
    app.kubernetes.io/name: kubemap-node-agent
    app.kubernetes.io/part-of: kubemap
  name: kubemap-node-agent
  namespace: kubemap-node
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/managed-by: kubemap
    app.kubernetes.io/name: kubemap-node-agent
    app.kubernetes.io/part-of: kubemap
  name: kubemap-node-agent
  namespace: kubemap-node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubemap-node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubemap-node-agent
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - node
        - --token
        - /var/run/secrets/kubemap/token
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CLUSTER_ID
          value: local
        - name: PORTAL_URL
          value: ws://kubemap.kubemap-system.svc:8080/v1/connect
        image: localhost/kubemap:dev
        imagePullPolicy: IfNotPresent
        name: node-agent
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 65533
          runAsNonRoot: true
          runAsUser: 65533
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /host
          name: host-root
          readOnly: true
          recursiveReadOnly: IfPossible
        - mountPath: /host/proc
          name: host-proc
          readOnly: true
          recursiveReadOnly: IfPossible
        - mountPath: /host/sys
          name: host-sys
          readOnly: true
          recursiveReadOnly: IfPossible
        - mountPath: /var/run/secrets/kubemap
          name: kubemap-identity
          readOnly: true
      hostPID: true
      securityContext:
        runAsGroup: 65533
        runAsNonRoot: true
        runAsUser: 65533
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kubemap-node-agent
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /
          type: Directory
        name: host-root
      - hostPath:
          path: /proc
          type: Directory
        name: host-proc
      - hostPath:
          path: /sys
          type: Directory
        name: host-sys
      - name: kubemap-identity
        projected:
          sources:
          - serviceAccountToken:
              audience: kubemap-portal
              expirationSeconds: 3600
              path: token
  updateStrategy: {}
status:
  currentNumberScheduled: 0
  desiredNumberScheduled: 0
  numberMisscheduled: 0
  numberReady: 0
