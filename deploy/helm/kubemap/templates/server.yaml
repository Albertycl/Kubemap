apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "kubemap.labels" (dict "name" "kubemap") | nindent 4 }}
  name: kubemap
  namespace: kubemap-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubemap
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubemap
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - args:
        - run
        - -listen
        - :8080
        - -data-dir
        - /data/kubemap
        command:
        - /usr/local/bin/kubemap-portal
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- with (.Values.observability | default dict).prometheusUrl }}
        - name: KUBEMAP_PROMETHEUS_URL
          value: {{ . | quote }}
        {{- end }}
        {{- with (.Values.observability | default dict).tempoUrl }}
        - name: KUBEMAP_TEMPO_URL
          value: {{ . | quote }}
        {{- end }}
        {{- with (.Values.observability | default dict).grafanaUrl }}
        - name: KUBEMAP_GRAFANA_URL
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.trustedProxies }}
        - name: KUBEMAP_TRUSTED_PROXIES
          value: {{ . | quote }}
        {{- end }}
        image: {{ include "kubemap.image" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        name: kubemap
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        resources:
          limits:
            memory: 384Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kubemap
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kubemap-data
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
---
apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "kubemap.labels" (dict "name" "kubemap") | nindent 4 }}
  name: kubemap
  namespace: kubemap-system
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app.kubernetes.io/name: kubemap
