{{- if .Values.ingress.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kubemap-tls
  namespace: kubemap-system
  labels:
    app.kubernetes.io/part-of: kubemap
spec:
  secretName: kubemap-tls
  dnsNames:
    - {{ .Values.ingress.host | quote }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.ingress.issuer | quote }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: kubemap-system
  labels:
    app.kubernetes.io/part-of: kubemap
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kubemap
  namespace: kubemap-system
  labels:
    app.kubernetes.io/part-of: kubemap
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: {{ printf "Host(`%s`) && !PathPrefix(`/v1/connect`)" .Values.ingress.host | quote }}
      services:
        - name: kubemap
          port: 8080
  tls:
    secretName: kubemap-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kubemap-http-redirect
  namespace: kubemap-system
  labels:
    app.kubernetes.io/part-of: kubemap
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: {{ printf "Host(`%s`)" .Values.ingress.host | quote }}
      middlewares:
        - name: redirect-https
      services:
        - kind: TraefikService
          name: noop@internal
{{- end }}
