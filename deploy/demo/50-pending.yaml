# pending: the pod requests 8 CPUs; the node has 4, so the scheduler cannot
# place it and it stays Pending (FailedScheduling: Insufficient cpu).
# Fix: lower the CPU request.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-worker
  namespace: kubemap-demo
  labels: &labels
    app.kubernetes.io/part-of: kubemap-demo
    app.kubernetes.io/name: batch-worker
    kubemap.io/scenario: pending
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: batch-worker
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo worker ready; exec sleep 3600"]
          resources:
            requests: {cpu: "8", memory: 6Mi}
            limits: {cpu: "8", memory: 6Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
