# netpol: a tiny frontend calls the backend every 5 s. The NetworkPolicy on
# the backend allows ingress only from pods labelled role=monitoring, so the
# frontend's calls time out and it logs connection errors.
# Fix: allow app.kubernetes.io/name=web in the policy's "from".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kubemap-demo
  labels: &labels
    app.kubernetes.io/part-of: kubemap-demo
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
    kubemap.io/scenario: netpol
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: traefik/whoami:v1.10
          args: ["--port", "8080", "--name", "api"]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health, port: http}
          resources:
            requests: {cpu: 5m, memory: 12Mi}
            limits: {cpu: 50m, memory: 12Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kubemap-demo
  labels:
    app.kubernetes.io/part-of: kubemap-demo
    kubemap.io/scenario: netpol
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kubemap-demo
  labels: &labels
    app.kubernetes.io/part-of: kubemap-demo
    app.kubernetes.io/name: web
    app.kubernetes.io/component: frontend
    kubemap.io/scenario: netpol
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: busybox:1.36
          env:
            - {name: API_URL, value: "http://api.kubemap-demo.svc/api"}
          command:
            - sh
            - -c
            - |
              while true; do
                if out=$(wget -q -T 3 -O - "$API_URL" 2>&1); then
                  echo "$(date -u +%FT%TZ) GET $API_URL ok"
                else
                  echo "$(date -u +%FT%TZ) ERROR GET $API_URL failed: ${out:-connection timed out}"
                fi
                sleep 5
              done
          resources:
            requests: {cpu: 5m, memory: 6Mi}
            limits: {cpu: 50m, memory: 6Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-monitoring-only
  namespace: kubemap-demo
  labels:
    app.kubernetes.io/part-of: kubemap-demo
    kubemap.io/scenario: netpol
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: monitoring
      ports:
        - {protocol: TCP, port: 8080}
