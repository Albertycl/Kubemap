# KM-88. Placeholders: <ns>, <hpa>, <deploy>, <pod> and $ns, $pod. k8server
# has no HPA today (28 Sep 2026) but runs metrics-server, which HPAs need.
id: pods-hpa-not-scaling
area: pods
title: "The HorizontalPodAutoscaler does not scale"
question: "Load is up, the pods are busy, but the HPA does not add replicas (or it flaps). What do you check?"
symptoms:
  - "kubectl get hpa shows TARGETS <unknown>/70% or stays at MINPODS under load"
  - "Latency rises with traffic while the replica count stays flat"
  - "Or the replica count goes up and down every few minutes (flapping)"
steps:
  - title: "What does the HPA see?"
    why: "The HPA compares a metric with its target and sets replicas = ceil(current × actual / target), within min and max. '<unknown>' means it cannot read the metric at all; a number means it reads it and decided not to scale."
    command: "kubectl -n <ns> get hpa <hpa>; kubectl -n <ns> describe hpa <hpa> | sed -n '/Metrics/,$p'"
    kubemap: "app-map"
    check: {op: "appmap", args: {namespace: "$ns"}}
    good: "The metric is read, and the desired replicas match the formula."
    bad: "<unknown> or FailedGetResourceMetric: the metrics pipeline (next step). Stuck at maxReplicas: the limit itself."
  - title: "Is the metrics pipeline working?"
    why: "CPU and memory HPAs read the metrics API (metrics.k8s.io), served by metrics-server. If it is down, or cannot scrape the kubelets, every HPA shows <unknown> and stays where it is."
    command: "kubectl get apiservice v1beta1.metrics.k8s.io; kubectl top pods -n <ns>; kubectl -n kube-system logs deploy/metrics-server --tail=20"
    kubemap: "findings"
    good: "The APIService is Available and kubectl top shows the pods."
    bad: "Not Available or no metrics: fix metrics-server (certificates, kubelet reachability)."
  - title: "Are CPU requests set? Utilization is relative to them"
    why: "A CPU utilization target of 70 % means 70 % of the container's CPU request. Without a request the HPA cannot compute it ('missing request for cpu'). A request far above real use makes the utilization look low forever."
    command: "kubectl -n <ns> get deployment <deploy> -o jsonpath='{range .spec.template.spec.containers[*]}{.name}{\"  requests \"}{.resources.requests}{\"\\n\"}{end}'; kubectl -n <ns> top pods -l app.kubernetes.io/name=<deploy>"
    kubemap: "pod"
    check: {op: "pod.diagnose", args: {namespace: "$ns", pod: "$pod"}}
    good: "Every container has a CPU request close to its real use."
    bad: "No request (the HPA cannot compute) or a request far above use (utilization never reaches the target)."
  - title: "Is it scaling, but slowly, or capped?"
    why: "Scale-up is limited by behavior policies and a stabilization window; scale-down waits 5 minutes by default. At maxReplicas it stops; new pods may also stay Pending when the cluster is full, which looks like 'not scaling'."
    command: "kubectl -n <ns> get hpa <hpa> -o jsonpath='min {.spec.minReplicas} max {.spec.maxReplicas} behavior {.spec.behavior}{\"\\n\"}'; kubectl -n <ns> get pods -l app.kubernetes.io/name=<deploy> --field-selector=status.phase=Pending"
    kubemap: "findings"
    good: "Below max, no Pending pods, and the events show recent scaling."
    bad: "At max, or new pods Pending: raise max or add capacity (pods-pending scenario)."
  - title: "Is CPU the right signal?"
    why: "Many services are limited by something else: I/O, a connection pool, a queue. Their CPU stays low while requests wait, so a CPU HPA never scales. Requests per second, queue length or latency (custom or external metrics, or KEDA) scale them better."
    command: "kubectl -n <ns> top pods -l app.kubernetes.io/name=<deploy>; kubectl -n <ns> logs <pod> --since=10m | grep -ciE 'timeout|pool|queue'"
    kubemap: "app-map"
    good: "CPU tracks the load: the HPA's metric fits."
    bad: "Latency rises while CPU stays flat: scale on requests, queue length or latency instead."
causes:
  - cause: "metrics-server is down or cannot reach the kubelets (<unknown> targets)."
    fix: "Fix metrics-server; check its logs for kubelet TLS or address errors."
    prove: "kubectl get apiservice v1beta1.metrics.k8s.io   # Available True"
  - cause: "No CPU request, or a request far above real use."
    fix: "Set CPU requests from measured use."
    prove: "kubectl -n <ns> get hpa <hpa>   # TARGETS shows a real percentage"
  - cause: "maxReplicas reached, or new replicas Pending for lack of capacity."
    fix: "Raise maxReplicas and add capacity; check the database connection budget before scaling far."
    prove: "kubectl -n <ns> get hpa <hpa>   # REPLICAS rising"
  - cause: "The wrong metric: the service is not CPU-bound."
    fix: "Scale on requests per second, queue length or latency (custom metrics adapter or KEDA)."
    prove: "Latency stays flat as load rises"
  - cause: "Flapping: no stabilization, or a target close to the idle load."
    fix: "Set behavior.scaleDown.stabilizationWindowSeconds and a sensible target."
    prove: "kubectl -n <ns> describe hpa <hpa>   # no up-down events every few minutes"
prevention:
  - "Requests set from measured use for every HPA-managed container"
  - "A load test that proves the HPA scales before a traffic peak"
  - "Alerts on HPAs at maxReplicas and on <unknown> metrics"
  - "The scaling limit checked against downstream limits (database connections, rate limits)"
senior:
  - "An HPA is only as good as its metric and the requests behind it: I check both before blaming the autoscaler."
  - "Scaling up an app can move the bottleneck to the database; I check the connection budget before raising max."
  - "Scale-up should be fast, scale-down slow: that is what behavior policies are for."
  - "What I would automate: an alert when an HPA is at max for 15 minutes, and a monthly load test."
