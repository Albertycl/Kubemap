# KM-88. Placeholders: <ns>, <deploy>, <pod> and $ns, $pod.
id: pods-rollout-stuck
area: pods
title: "A rollout is stuck: roll back or push on?"
question: "kubectl rollout status never finishes, or a deploy left old and new pods side by side. What do you do?"
symptoms:
  - "'Waiting for deployment … rollout to finish: 1 out of 3 new replicas have been updated'"
  - "The Deployment reports Progressing=False with ProgressDeadlineExceeded"
  - "Old and new ReplicaSets both have pods; the new pods are not Ready"
steps:
  - title: "What state is the rollout in?"
    why: "A rollout moves ReplicaSets step by step: it starts new pods (maxSurge) and stops old ones only when new ones are Ready (maxUnavailable). If new pods never become Ready, it stops and, after progressDeadlineSeconds (600 s by default), marks Progressing=False. It never rolls back by itself."
    command: "kubectl -n <ns> rollout status deployment/<deploy> --timeout=5s; kubectl -n <ns> get deployment <deploy> -o jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}: {.message}{\"\\n\"}{end}'"
    kubemap: "app-map"
    check: {op: "appmap", args: {namespace: "$ns"}}
    good: "Progressing=True with NewReplicaSetAvailable: it finished."
    bad: "ProgressDeadlineExceeded, or ReplicaSetUpdated for a long time: look at the new pods."
  - title: "Is the old version still serving?"
    why: "Before debugging, protect users. If maxUnavailable let old pods go before new ones were Ready, capacity is down; if the new pods are in the Service and failing, users see errors. The ReplicaSets and the Service's endpoints tell which."
    command: "kubectl -n <ns> get replicasets -l app.kubernetes.io/name=<deploy> -o wide --sort-by=.metadata.creationTimestamp; kubectl -n <ns> get pods -l app.kubernetes.io/name=<deploy> -o wide"
    kubemap: "app-map"
    good: "The old ReplicaSet still has its Ready pods; users are served by the old version."
    bad: "Few or no Ready pods: roll back now (step 5), debug after."
  - title: "Why are the new pods not Ready?"
    why: "The new pods fail for the same reasons as any pod: an image that cannot be pulled, a crash at start (a new setting missing), a readiness probe that fails with the new code, or no room to schedule the surge pods. The pod checklist names it."
    command: "kubectl -n <ns> describe pod <pod> | sed -n '/Containers/,$p' | head -60; kubectl -n <ns> logs <pod> --previous --tail=30"
    kubemap: "debug"
    check: {op: "pod.debug", args: {namespace: "$ns", pod: "$pod"}}
    good: "The new pod is Running and becomes Ready: the rollout was only slow (slow start, a long readiness delay)."
    bad: "ImagePullBackOff, CrashLoopBackOff, readiness failures or Pending: open the matching scenario."
  - title: "Is it waiting for room? Surge pods and quotas"
    why: "With maxSurge the rollout needs capacity for extra pods. A ResourceQuota, a full node or a PodDisruptionBudget can block it: the new pod stays Pending or is never created (FailedCreate on the ReplicaSet)."
    command: "kubectl -n <ns> get events --field-selector reason=FailedCreate --sort-by=.lastTimestamp | tail -5; kubectl -n <ns> get deployment <deploy> -o jsonpath='{.spec.strategy}'; kubectl -n <ns> describe resourcequota"
    kubemap: "findings"
    good: "No FailedCreate, quota has room."
    bad: "Exceeded quota or Insufficient cpu/memory: free room, or use maxSurge 0 with maxUnavailable 1 for this rollout."
  - title: "Decide: roll back or fix forward"
    why: "Rolling back is the fastest mitigation when the old version worked; it restores the previous ReplicaSet's pod template. With GitOps (Argo CD), roll back in Git, or Argo CD will re-apply the broken version."
    command: "kubectl -n <ns> rollout history deployment/<deploy>; kubectl -n <ns> get deployment <deploy> -o jsonpath='{.metadata.annotations}'   # managed by Argo CD? then revert the commit instead of rollout undo"
    kubemap: "app-map"
    good: "You know the last good revision and who owns the manifest (kubectl or Git)."
    bad: "No history (revisionHistoryLimit 0) or managed by Git: revert in Git and let Argo CD sync."
causes:
  - cause: "The new image or config crashes or fails its readiness probe."
    fix: "Roll back (kubectl rollout undo deployment/<name>, or revert in Git), then fix and release again."
    prove: "kubectl -n <ns> rollout status deployment/<name>   # successfully rolled out"
  - cause: "The new image cannot be pulled (wrong tag, private registry)."
    fix: "Fix the tag or credentials; roll back first if users are affected."
    prove: "kubectl -n <ns> get pods   # new pods Running"
  - cause: "No room for surge pods (quota, full node)."
    fix: "Free capacity, or change the strategy to maxSurge 0, maxUnavailable 1 for tight namespaces."
    prove: "kubectl -n <ns> get events --field-selector reason=FailedCreate   # none new"
  - cause: "A new required setting (ConfigMap key, Secret) was not deployed with the code."
    fix: "Deploy the setting first, then the code; restart the new pods."
    prove: "kubectl -n <ns> logs <pod>   # no missing-setting error"
prevention:
  - "Readiness probes that test the new code path, and progressDeadlineSeconds tuned to the app's real start time"
  - "Canary or progressive delivery (Argo Rollouts, Flagger) with automatic rollback on error rate"
  - "Config and Secrets released before the code that needs them, and in the same Git change"
  - "An alert on Deployments with Progressing=False, and on old and new ReplicaSets both having pods for more than 15 minutes"
senior:
  - "Mitigate first: if the old version is serving, I stop and roll back before I debug."
  - "A rollout never rolls back by itself; ProgressDeadlineExceeded is only a signal."
  - "With GitOps, the rollback is a revert in Git, or the controller re-applies the broken version."
  - "What I would automate: a deploy gate that watches error rate and readiness and rolls back on its own."
