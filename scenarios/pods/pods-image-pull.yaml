# KM-84. Placeholders: <ns>, <pod>, <node> and $ns, $pod.
id: pods-image-pull
area: pods
title: "ImagePullBackOff or ErrImageNeverPull"
question: "A pod cannot start because of ErrImagePull, ImagePullBackOff or ErrImageNeverPull. What do you do?"
symptoms:
  - "STATUS ErrImagePull, then ImagePullBackOff; or ErrImageNeverPull"
  - "The pod was scheduled (it has a node) but no container ever started"
  - "After a node's disk filled up, a pod that ran for months suddenly cannot start (28 Sep 2026: url-shortener)"
steps:
  - title: "Which container, which image, which pull policy?"
    why: "The waiting reason, the exact image string and the imagePullPolicy decide everything that follows. ErrImagePull and ImagePullBackOff mean the kubelet tried to pull and failed. ErrImageNeverPull means imagePullPolicy is Never and the image is not on the node, so the kubelet did not even try."
    command: |-
      kubectl -n <ns> get pod <pod> -o jsonpath='{range .spec.containers[*]}{.name}{"  "}{.image}{"  policy "}{.imagePullPolicy}{"\n"}{end}{range .status.containerStatuses[*]}{.name}{"  waiting: "}{.state.waiting.reason}{"\n"}{end}'
    kubemap: "debug"
    check: {op: "pod.debug", args: {namespace: "$ns", pod: "$pod"}}
    good: "The image string is the one the release meant to use."
    bad: "A typo, a wrong tag or registry, or policy Never: continue with the message."
  - title: "Read the kubelet's exact message"
    why: "The message tells the causes apart: 'not found' (wrong name or tag), 'unauthorized' or 'denied' (credentials), 'i/o timeout' or 'no such host' (the node cannot reach the registry), 'toomanyrequests' (Docker Hub rate limit), 'is not present with pull policy of Never' (local-only image that is gone)."
    command: "kubectl -n <ns> describe pod <pod> | grep -iE 'Failed|pull' | tail -5"
    kubemap: "pod"
    check: {op: "pod.diagnose", args: {namespace: "$ns", pod: "$pod"}}
    good: "The message names one cause: follow the matching step."
    bad: "Only 'Back-off pulling image': look further up the events for the first 'Failed to pull image' line."
  - title: "Wrong name or tag?"
    why: "A tag that does not exist is the most common cause, often a typo or a release that was never pushed. Checking the registry settles it without touching the cluster."
    command: "kubectl -n <ns> get pod <pod> -o jsonpath='{.spec.containers[*].image}'   # then check that exact tag in the registry (web page, crane ls, or docker manifest inspect)"
    kubemap: "pod"
    good: "The tag exists in the registry."
    bad: "It does not: fix the tag in the Deployment, or push the image."
  - title: "Credentials for a private registry?"
    why: "A private registry answers 'unauthorized'. The pod needs imagePullSecrets, either on the pod or on its ServiceAccount, in the pod's namespace."
    command: "kubectl -n <ns> get pod <pod> -o jsonpath='{.spec.imagePullSecrets}{\"  sa: \"}{.spec.serviceAccountName}'; kubectl -n <ns> get serviceaccount default -o jsonpath='{.imagePullSecrets}'"
    kubemap: "pod"
    good: "A pull Secret is set and exists in this namespace (check only its name; do not print its contents)."
    bad: "No pull Secret, or it is in another namespace: create it here and reference it."
  - title: "ErrImageNeverPull: is the image on the node?"
    why: "With imagePullPolicy: Never the image must already be in the node's container runtime. It was loaded by hand (k3s ctr images import) and exists nowhere else. The kubelet's image clean-up deletes unused images when the disk passes imageGCHighThresholdPercent (85 % on k8server) or during disk pressure, and an image of a stopped or evicted pod counts as unused."
    command: "sudo k3s crictl images   # on the node <node>: is the image and tag from step 1 in the list?"
    kubemap: "node"
    good: "The image is on the node: check that the name and tag match exactly."
    bad: "It is gone: import it again now, and move it to a registry (see causes)."
  - title: "Did the kubelet delete it? Image clean-up and disk pressure"
    why: "On 28 Sep 2026 the root disk of k8server filled, the kubelet evicted pods and its image garbage collector removed images to free space ('Removing image to free bytes'). url-shortener's image existed only on the node, so after the incident its pods failed with ErrImageNeverPull until the image was imported again (08:05 to 08:10)."
    command: "journalctl -u k3s --since -24h | grep -E 'image_gc_manager|Removing image to free bytes|Image garbage collection' | tail   # on the node <node>"
    kubemap: "findings"
    check: {op: "node.pressure", args: {node: "$node"}}
    good: "No image clean-up recently: the image was never there."
    bad: "Images were removed: the disk was full. Fix the disk first (the DiskPressure scenario), then restore the image."
  - title: "Can the node reach the registry?"
    why: "'i/o timeout', 'no such host' or TLS errors mean the node cannot reach the registry: DNS, a proxy, a firewall, or an egress rule. Pulls are made by the node's container runtime, not by a pod, so a NetworkPolicy does not apply."
    command: "curl -sS -o /dev/null -w '%{http_code}\\n' https://registry-1.docker.io/v2/   # on the node <node>: 401 means reachable"
    kubemap: "node"
    good: "The registry answers (401 without credentials is fine)."
    bad: "No answer: fix DNS, the proxy or the firewall for the node."
causes:
  - cause: "The tag does not exist (typo, or the image was never pushed)."
    fix: "Use the right tag, or push the image; pin it by digest."
    prove: "kubectl -n <ns> rollout status deployment/<name>"
  - cause: "The registry needs credentials and the pod has none."
    fix: "Create a docker-registry Secret in the namespace and add it to the pod or its ServiceAccount."
    prove: "kubectl -n <ns> get pod <pod>   # Running"
  - cause: "imagePullPolicy Never, and the local image was deleted by the kubelet's image clean-up (url-shortener, 28 Sep 2026)."
    fix: "Short term: import the image again (sudo k3s ctr images import image.tar). For good: push it to a registry and use imagePullPolicy IfNotPresent."
    prove: "kubectl -n <ns> get pods   # Running; and: kubectl get pods -A -o jsonpath='{..imagePullPolicy}' | tr ' ' '\\n' | grep -c Never   # 0"
  - cause: "Docker Hub's anonymous pull rate limit (toomanyrequests)."
    fix: "Authenticate pulls, use a pull-through cache or mirror, or copy the images to your own registry."
    prove: "kubectl -n <ns> describe pod <pod> | grep -c toomanyrequests   # 0 new"
  - cause: "The node cannot reach the registry (DNS, proxy, firewall)."
    fix: "Fix the node's network path to the registry; set the proxy for the container runtime if one is needed."
    prove: "curl -sS -o /dev/null -w '%{http_code}' https://registry-1.docker.io/v2/   # 401"
prevention:
  - "Every image in a registry the cluster can pull from; no imagePullPolicy: Never outside a lab"
  - "Images pinned by digest and promoted from test to production, not retyped"
  - "Keep the node's disk below the image clean-up threshold, so images are not deleted under pressure"
  - "Alert on pods in ErrImagePull, ImagePullBackOff or ErrImageNeverPull for more than a few minutes"
senior:
  - "I read the pull error word for word: 'not found', 'unauthorized', 'timeout' and 'toomanyrequests' are four different problems."
  - "ErrImageNeverPull after a disk incident means the recovery is not over: the kubelet deleted an image that existed only on the node."
  - "Blast radius: one image (a release problem) or every pull on one node (network or disk) or on every node (the registry)?"
  - "What I would automate: a CI check that every image in the manifests exists, and a rule that forbids imagePullPolicy: Never."
lab: "kubemap-demo/imagepull"
