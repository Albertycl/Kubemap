# KM-84. Placeholders: <ns>, <pod>, <node> and $ns, $pod.
id: pods-pending
area: pods
title: "A pod stays Pending"
question: "A new pod never starts and stays Pending. What do you do?"
symptoms:
  - "STATUS Pending, no node in the NODE column"
  - "A rollout hangs, or a Deployment has fewer pods than it wants"
  - "Sometimes the pod does not even exist: the ReplicaSet could not create it"
steps:
  - title: "Is it waiting for a node, or for something on the node?"
    why: "Pending covers two things. Not scheduled (PodScheduled=False, no node yet) is the scheduler's problem. Scheduled but not started (a node is set, containers are waiting) is an image or volume problem on that node."
    command: "kubectl -n <ns> get pod <pod> -o wide; kubectl -n <ns> get pod <pod> -o jsonpath='{.status.conditions}'"
    kubemap: "debug"
    check: {op: "pod.debug", args: {namespace: "$ns", pod: "$pod"}}
    good: "A node is set and the containers start: it was only slow."
    bad: "No node and PodScheduled=False: read the scheduler's reason (next step). A node is set but containers wait: go to the image pull scenario."
  - title: "Read the scheduler's reason"
    why: "The FailedScheduling event names, per node, why it does not fit: 'Insufficient cpu', 'Insufficient memory', 'untolerated taint', 'didn't match node affinity/selector', 'unbound PersistentVolumeClaims'. The message is the diagnosis."
    command: "kubectl -n <ns> describe pod <pod> | sed -n '/Events/,$p'"
    kubemap: "pod"
    good: "No FailedScheduling event: the pod was just created, wait a few seconds."
    bad: "0/N nodes are available: … read each reason and follow the matching step below."
  - title: "Insufficient cpu or memory: requests against what is free"
    why: "The scheduler places pods by their requests, not by real use. A node is full when the sum of requests reaches allocatable, even if the CPUs are idle. One pod asking for more than any node has will never fit."
    command: "kubectl -n <ns> get pod <pod> -o jsonpath='{range .spec.containers[*]}{.name}{\"  \"}{.resources.requests}{\"\\n\"}{end}'; kubectl describe node <node> | grep -A8 'Allocated resources'; kubectl get node <node> -o jsonpath='{.status.allocatable}'"
    kubemap: "node"
    good: "The pod's requests fit into what the node has left."
    bad: "The requests are larger than any node's free allocatable: lower them to real use, free capacity, or add a node."
  - title: "Taints, node selectors and affinity"
    why: "A node with a taint the pod does not tolerate is skipped. The kubelet adds taints itself: node.kubernetes.io/disk-pressure or memory-pressure during pressure, not-ready and unreachable when the node is down. A nodeSelector or affinity that no node matches also leaves the pod Pending."
    command: "kubectl get nodes -o custom-columns=NAME:.metadata.name,TAINTS:.spec.taints; kubectl -n <ns> get pod <pod> -o jsonpath='{.spec.nodeSelector}{\"\\n\"}{.spec.affinity}{\"\\n\"}{.spec.tolerations}'"
    kubemap: "node"
    check: {op: "node.pressure"}
    good: "No taints, or the pod tolerates them, and its selector matches a node."
    bad: "A pressure or not-ready taint: fix the node first (node scenarios). A selector no node matches: fix the selector or label a node."
  - title: "Is it waiting for a volume?"
    why: "A pod that uses a PersistentVolumeClaim waits until the claim is bound. A missing StorageClass, a provisioner that is down, or a volume in another zone keeps it Pending."
    command: "kubectl -n <ns> get pvc; kubectl -n <ns> describe pvc | sed -n '/Events/,$p'; kubectl get storageclass"
    kubemap: "pod"
    good: "Every claim the pod uses is Bound."
    bad: "A claim is Pending: fix its StorageClass or the provisioner (on k3s: local-path-provisioner in kube-system)."
  - title: "Does the pod exist at all? Quotas and admission"
    why: "If the namespace's ResourceQuota is used up, or an admission rule (Pod Security, a webhook) refuses the pod, the pod is never created. There is nothing Pending to look at: the error is on the ReplicaSet or Job."
    command: "kubectl -n <ns> get events --field-selector reason=FailedCreate --sort-by=.lastTimestamp | tail -5; kubectl -n <ns> describe resourcequota"
    kubemap: "findings"
    good: "No FailedCreate events, and the quota has room."
    bad: "'exceeded quota' or 'violates PodSecurity': raise the quota or fix the pod's spec."
causes:
  - cause: "The pod requests more CPU or memory than any node has free."
    fix: "Lower the requests to measured use, free capacity (scale down or remove idle workloads), or add a node."
    prove: "kubectl -n <ns> get pod <pod> -o wide   # Running on a node"
  - cause: "Every node has a taint the pod does not tolerate (often the kubelet's disk-pressure or not-ready taint)."
    fix: "Fix the node condition behind the taint; add a toleration only for taints the workload really should ignore."
    prove: "kubectl get nodes -o custom-columns=NAME:.metadata.name,TAINTS:.spec.taints   # no pressure taints"
  - cause: "A nodeSelector or affinity that no node matches."
    fix: "Fix the selector, or label the node the workload is meant for."
    prove: "kubectl get nodes -l <key>=<value>   # at least one node"
  - cause: "The PersistentVolumeClaim is not bound."
    fix: "Create or fix the StorageClass and its provisioner; check capacity and zone."
    prove: "kubectl -n <ns> get pvc   # Bound"
  - cause: "The namespace's ResourceQuota is used up (the pod is never created)."
    fix: "Raise the quota or lower requests; remove what the namespace no longer needs."
    prove: "kubectl -n <ns> describe resourcequota   # used below hard"
prevention:
  - "Requests set from measured use, not guesses; alert when the sum of requests passes 80 % of allocatable"
  - "Keep spare capacity for one node's pods (N+1), so a node failure does not leave pods Pending"
  - "Alert on pods Pending for more than a few minutes (kube_pod_status_phase{phase=\"Pending\"})"
  - "Watch node pressure: pressure taints block scheduling before anything is evicted"
senior:
  - "The scheduler uses requests, not real use: 'the node is idle' and 'the pod does not fit' can both be true."
  - "I read the FailedScheduling message word for word; it lists the reason per node."
  - "On a single-node cluster every Pending pod is a capacity question: there is nowhere else to go."
  - "What I would automate: an alert on Pending pods older than five minutes, and a capacity report of requests against allocatable."
lab: "kubemap-demo/pending"
