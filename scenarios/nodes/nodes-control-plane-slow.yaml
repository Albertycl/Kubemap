# KM-88. Placeholders: <node> and $node. k8server facts: k3s v1.34.8, one
# server, datastore SQLite through kine (no etcd role on the node); the API
# server's storage latency is still exported as etcd_request_duration_seconds.
id: nodes-control-plane-slow
area: nodes
title: "The control plane is slow"
question: "kubectl takes seconds to answer, controllers lag, and deploys are slow. What do you check?"
symptoms:
  - "kubectl get pods takes several seconds, or times out with 'context deadline exceeded'"
  - "New pods start late; Deployments, cert-manager or Argo CD react slowly"
  - "Errors like 'the server was unable to return a response in the time allotted' or HTTP 429 (too many requests)"
steps:
  - title: "Is the API server healthy, and how slow is it?"
    why: "The API server's own health checks list every internal check (storage, informers, admission webhooks). Timing one simple request gives a baseline you can compare after each change."
    command: "kubectl get --raw '/livez?verbose' | grep -v '+'; kubectl get --raw '/readyz?verbose' | grep -v '+'; time kubectl get --raw /api/v1/namespaces >/dev/null"
    kubemap: "node"
    check: {op: "node.pressure", args: {node: "$node"}}
    good: "livez and readyz pass, and a simple GET takes well under a second."
    bad: "A failing check names the part (storage, a webhook); slow answers with every check ok point at load or storage latency."
  - title: "Is the node that runs the control plane short of resources?"
    why: "On k3s the API server, controllers, scheduler and datastore run in the k3s process on the server node. CPU contention, swapping or a slow disk on that node slow everything. k8server had CPU pressure (25–50 % some) from build jobs on 28 Sep."
    command: "ssh <node> 'cat /proc/pressure/cpu /proc/pressure/memory /proc/pressure/io; top -b -n1 -o %CPU | head -12'"
    kubemap: "node"
    good: "Low pressure, k3s not starved."
    bad: "High CPU or I/O pressure: move the load off the server node (see nodes-psi)."
  - title: "Is the datastore slow?"
    why: "Every write, and every list without a cache, goes to the datastore. With etcd, fsync latency on the disk is the classic cause; with SQLite (kine, the k3s single-server default) a slow or busy disk does the same. The API server's storage request latency shows it."
    command: "kubectl get --raw /metrics | grep -E '^etcd_request_duration_seconds_(sum|count)' | grep -E 'operation=\"(list|get|update|create)\"' | head -20   # sum / count = average seconds per call"
    kubemap: "node"
    good: "Storage calls average a few milliseconds."
    bad: "Tens or hundreds of milliseconds: the datastore's disk is the bottleneck (node I/O pressure, a busy disk)."
  - title: "Who is calling so much? Expensive or chatty clients"
    why: "One client listing every pod in the cluster every few seconds, or a controller in a hot loop, can load the API server alone. Request counts by resource, verb and client show the heavy callers; API Priority and Fairness sheds load with 429s."
    command: "kubectl get --raw /metrics | grep -E '^apiserver_request_total' | sort -t' ' -k2 -n -r | head -15; kubectl get --raw /metrics | grep -E '^apiserver_flowcontrol_rejected_requests_total' | head"
    kubemap: "findings"
    good: "No single resource or verb dominates, and nothing is rejected."
    bad: "Huge LIST counts on one resource, or rejected requests: find the client (audit log, user agent) and fix its pattern (use watches and informers)."
  - title: "Do admission webhooks add latency?"
    why: "Every create or update passes through the mutating and validating webhooks. A slow or unreachable webhook (its pod down, a NetworkPolicy) adds its timeout to every write, or blocks writes with failurePolicy Fail."
    command: "kubectl get mutatingwebhookconfigurations,validatingwebhookconfigurations; kubectl get --raw /metrics | grep -E '^apiserver_admission_webhook_admission_duration_seconds_(sum|count)' | head"
    kubemap: "findings"
    good: "Webhook calls are fast and their Services have ready endpoints."
    bad: "A webhook is slow or failing: fix its pods, or scope it with a namespaceSelector so it does not sit on every write."
  - title: "Too many objects?"
    why: "Lists get slower as objects pile up: thousands of old ReplicaSets, completed Jobs, events or evicted pods. The storage object counts show which resource is large (k8server had about 2,840 dead pods after the 28 Sep incident before they were cleaned)."
    command: "kubectl get --raw /metrics | grep -E '^apiserver_storage_objects' | sort -t' ' -k2 -n -r | head -10"
    kubemap: "findings"
    good: "No resource with an unusual count."
    bad: "One resource with tens of thousands of objects: clean up (history limits, TTL for Jobs, delete evicted pods)."
causes:
  - cause: "The control-plane node is starved of CPU or I/O by other work (builds on k8server)."
    fix: "Move that work off the server node; reserve resources for k3s (system-reserved)."
    prove: "time kubectl get --raw /api/v1/namespaces   # back to under a second"
  - cause: "Slow datastore disk (etcd fsync, or SQLite on a busy disk)."
    fix: "Give the datastore a fast, dedicated disk; for k3s with growth, move to embedded etcd or an external datastore on SSD."
    prove: "etcd_request_duration_seconds average back to milliseconds"
  - cause: "A chatty client or a controller in a hot loop."
    fix: "Fix the client to use watches; limit it with API Priority and Fairness."
    prove: "apiserver_request_total for that client stops climbing fast"
  - cause: "A slow or unreachable admission webhook."
    fix: "Repair the webhook's backend, set timeoutSeconds low, scope it with selectors."
    prove: "apiserver_admission_webhook_admission_duration_seconds back to low values"
  - cause: "Object sprawl (old ReplicaSets, Jobs, events, dead pods)."
    fix: "revisionHistoryLimit, ttlSecondsAfterFinished, delete dead pods."
    prove: "apiserver_storage_objects for that resource back to normal"
prevention:
  - "The control plane on its own nodes (or at least without build or batch load)"
  - "A fast disk for the datastore, and alerts on its latency"
  - "Alerts on API server latency (apiserver_request_duration_seconds p99) and on 429 rejections"
  - "History limits and TTLs on every controller-created object"
senior:
  - "Everything in Kubernetes goes through the API server; a slow control plane looks like every other problem at once."
  - "I separate three causes: the node is starved, the datastore is slow, or a client is abusive. The metrics tell which in minutes."
  - "On a single-server k3s the control plane shares the node with workloads: noisy neighbours hurt the whole cluster, not just one app."
  - "What I would automate: an API latency SLO with an alert, and a weekly report of the top API callers."
