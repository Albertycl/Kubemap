# KM-85. Placeholders: <node> and $node.
id: nodes-notready
area: nodes
title: "A node is NotReady"
question: "kubectl get nodes shows a node NotReady (or Unknown). What do you do?"
symptoms:
  - "STATUS NotReady for one node; its pods show Unknown, Terminating or stay put"
  - "After about 5 minutes its pods are replaced on other nodes, or stay Pending on a single-node cluster"
  - "On a single-node cluster like k8server the API itself may be gone: kubectl times out"
steps:
  - title: "Which condition, since when, and why?"
    why: "Ready=False means the kubelet is alive and reports a reason (container runtime down, network plugin not ready, PLEG unhealthy). Ready=Unknown with 'Kubelet stopped posting node status' means the control plane has not heard from the kubelet for 40 seconds: the node, the kubelet or the network to it is down."
    command: |-
      kubectl get node <node> -o jsonpath='{range .status.conditions[*]}{.type}{"="}{.status}{"  "}{.reason}{"  heartbeat "}{.lastHeartbeatTime}{"  "}{.message}{"\n"}{end}'
    kubemap: "node"
    check: {op: "node.pressure", args: {node: "$node"}}
    good: "Ready=True with a fresh heartbeat: it was a short hiccup; look at what restarted."
    bad: "Ready=False: read the message. Ready=Unknown: the kubelet is not reporting; go to the node itself."
  - title: "Is the node up, and is the kubelet running?"
    why: "Ping and SSH separate 'the machine is down or unreachable' from 'the kubelet (on k3s, the k3s service) is down'. The service log shows why it stopped or keeps restarting."
    command: "ping -c3 <node>; ssh <node> 'systemctl status k3s --no-pager | head -5; journalctl -u k3s --since -15min --no-pager | tail -30'"
    kubemap: "logs"
    good: "The node answers and k3s is active: look at resources and the network (next steps)."
    bad: "No answer: the machine, its power or its network. k3s failed: its log names the error (certificates, disk, a bad config change)."
  - title: "Is the node out of disk, memory or PIDs?"
    why: "A full root disk stops the container runtime and the kubelet from writing; memory exhaustion makes the kernel OOM killer take the kubelet or containerd; too many processes stop new ones. Any of these turns a node NotReady."
    command: "ssh <node> 'df -h / /var/lib/rancher; free -h; cat /proc/pressure/memory; ps -e --no-headers | wc -l'"
    kubemap: "node"
    good: "Disk above 15 % free, memory available, normal process count."
    bad: "Disk full or memory exhausted: fix that first (the DiskPressure or swap scenario)."
  - title: "Is the network plugin running on the node?"
    why: "Without the CNI (Calico on k8server) the kubelet reports NetworkReady=false and the node is NotReady; the NetworkUnavailable condition shows the same. calico-node runs as a DaemonSet pod on every node."
    command: "kubectl -n calico-system get pods -o wide --field-selector spec.nodeName=<node>; kubectl get node <node> -o jsonpath='{.status.conditions[?(@.type==\"NetworkUnavailable\")]}'"
    kubemap: "node"
    good: "calico-node is Running and ready on the node, NetworkUnavailable=False."
    bad: "calico-node is crash-looping or missing: read its logs; the node stays NotReady until it runs."
  - title: "Certificates and clock"
    why: "The kubelet talks to the API server over TLS. An expired client certificate or a clock far off makes every request fail, and the node goes Unknown. k3s rotates certificates at start when they expire within 90 days, so a k3s restart often fixes an old node."
    command: "ssh <node> 'timedatectl | grep -E \"synchronized|Local time\"; sudo openssl x509 -noout -enddate -in /var/lib/rancher/k3s/agent/client-kubelet.crt'"
    kubemap: "node"
    good: "The clock is synchronised and the certificate is valid."
    bad: "Expired or clock off: fix time sync (NTP); restart k3s to rotate the certificates."
  - title: "What happens to the pods on it?"
    why: "The node controller taints a NotReady node (node.kubernetes.io/not-ready or unreachable, NoExecute). Pods tolerate that for 300 s by default, then they are deleted and their controllers create new ones elsewhere. StatefulSet pods are not replaced until the old pod is really gone, so they can hang."
    command: "kubectl get node <node> -o jsonpath='{.spec.taints}'; kubectl get pods -A -o wide --field-selector spec.nodeName=<node>"
    kubemap: "node"
    good: "Pods were rescheduled and the apps are serving."
    bad: "Pods stuck Terminating (StatefulSets, local volumes): once you know the node is really down, decide whether to force-delete them."
causes:
  - cause: "The kubelet or k3s service stopped or crash-loops (a bad config change, a failed upgrade)."
    fix: "Read journalctl -u k3s, undo the change, restart the service."
    prove: "kubectl get node <node>   # Ready"
  - cause: "The root disk is full (container runtime and kubelet cannot write)."
    fix: "Free space safely (see the DiskPressure scenario), then restart k3s if it does not recover."
    prove: "kubectl get node <node>   # Ready, DiskPressure False"
  - cause: "The node ran out of memory and the kernel killed the kubelet or containerd."
    fix: "Stop the memory hog; reserve memory for the system (system-reserved, kube-reserved) so it cannot happen again."
    prove: "journalctl -k --since -1h | grep -ci 'out of memory'   # 0"
  - cause: "The network plugin (calico-node) is not running on the node."
    fix: "Fix calico-node (its logs name the cause: IP pool, BGP, datastore access)."
    prove: "kubectl -n calico-system get pods -o wide --field-selector spec.nodeName=<node>   # Running 1/1"
  - cause: "Expired kubelet certificate or a clock far off."
    fix: "Fix time sync; restart k3s so it rotates its certificates."
    prove: "kubectl get node <node>   # Ready"
  - cause: "The machine is down or unreachable (power, network, hypervisor)."
    fix: "Bring it back; on a multi-node cluster, cordon and drain it once it is back before maintenance."
    prove: "kubectl get node <node>   # Ready"
prevention:
  - "system-reserved and kube-reserved, so workloads cannot starve the kubelet and the container runtime"
  - "Disk alerts before the kubelet's eviction threshold, and build caches off the node's root disk"
  - "Alert on node Ready != True for more than a minute, and on k3s service restarts"
  - "At least three nodes and a PodDisruptionBudget per app, so one node going away does not take an app down"
senior:
  - "Ready=Unknown and Ready=False are different: the first means the control plane lost contact, the second that the kubelet itself reports a problem."
  - "On a single-node cluster, a NotReady node is a full outage: there is nowhere to reschedule, so restore the node, do not wait for failover."
  - "I check blast radius and time first: one node, since when, what changed on it (an upgrade, a config change, a full disk)."
  - "What I would automate: alerts on node Ready, disk and memory, and a runbook step that collects journalctl -u k3s before anyone restarts it."
