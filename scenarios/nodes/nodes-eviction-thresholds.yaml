# KM-85. Placeholders: <node> and $node. Values quoted are k8server's on
# 28 Sep 2026 (kubectl get --raw /api/v1/nodes/k8server/proxy/configz).
id: nodes-eviction-thresholds
area: nodes
title: "Kubelet eviction thresholds and minimum reclaim"
question: "When will the kubelet start evicting pods on this node, and when will it stop?"
symptoms:
  - "You are planning disk or memory headroom, or an incident review asks why evictions went on so long"
  - "A node flaps in and out of DiskPressure or MemoryPressure"
  - "Pods were OOM-killed by the kernel, but the kubelet never evicted anything"
steps:
  - title: "Read the kubelet's eviction settings"
    why: "evictionHard starts eviction at once when a signal drops below it; evictionSoft only after a grace period. evictionMinimumReclaim is extra: once eviction starts, the kubelet frees until threshold + minimum reclaim. evictionPressureTransitionPeriod keeps the condition True for that long after recovery. k8server: nodefs and imagefs at 5 %, minimum reclaim 10 %, transition 5 minutes, no soft thresholds."
    command: |-
      kubectl get --raw /api/v1/nodes/<node>/proxy/configz | jq '.kubeletconfig | {evictionHard, evictionSoft, evictionSoftGracePeriod, evictionMinimumReclaim, evictionPressureTransitionPeriod, imageGCHighThresholdPercent, imageGCLowThresholdPercent, systemReserved, kubeReserved}'
    kubemap: "findings"
    good: "Every signal you care about (memory.available, nodefs.available, imagefs.available, inodes) has a threshold, and you know the reclaim target."
    bad: "A signal is missing, or the reclaim target is higher than the node can reach after a normal cleanup: that is a long eviction waiting to happen."
  - title: "Is there a memory threshold at all?"
    why: "If you set evictionHard, the signals you leave out may have no threshold. Allocatable memory is capacity minus reserves minus the memory.available threshold; when allocatable memory equals capacity, there is neither. On k8server allocatable memory equals capacity (12199944Ki): the kubelet never evicts for memory, and the kernel OOM killer is the only protection."
    command: "kubectl get node <node> -o jsonpath='capacity {.status.capacity.memory}  allocatable {.status.allocatable.memory}{\"\\n\"}capacity {.status.capacity.ephemeral-storage}  allocatable {.status.allocatable.ephemeral-storage}{\"\\n\"}'"
    kubemap: "node"
    good: "Allocatable memory is below capacity by the reserves and the memory threshold."
    bad: "They are equal: add memory.available to evictionHard and set system-reserved and kube-reserved."
  - title: "Where is the node now, against the trigger and the target?"
    why: "With nodefs.available below 5 % and a 10 % minimum reclaim, the trigger is 5 % free and the target is 15 % free. On a 93 GiB disk that is about 4.7 GiB and 14 GiB. The distance to the trigger is your warning time; the distance to the target is how much a cleanup must free once eviction has started."
    command: "ssh <node> 'df -h / /var/lib/rancher; df -i /'"
    kubemap: "node"
    check: {op: "node.pressure", args: {node: "$node"}}
    good: "Well above the target (Kubemap warns at threshold + 10 points: 15 % free on k8server)."
    bad: "Between the trigger and the target: one busy hour of logs or builds starts an eviction that will not stop until the target is reached."
  - title: "Which pods would go first?"
    why: "For memory, the kubelet evicts BestEffort pods first, then Burstable pods using more than their request, by priority and by how far they are over. For disk, pods using the most ephemeral storage over their request go first; a pod with no request is always over it (28 Sep: 'request is 0')."
    command: "kubectl get pods -A --field-selector spec.nodeName=<node> -o custom-columns=NS:.metadata.namespace,POD:.metadata.name,QOS:.status.qosClass,PRIORITY:.spec.priorityClassName"
    kubemap: "findings"
    good: "Important pods are Guaranteed or have a high priority class and ephemeral-storage requests."
    bad: "Everything is BestEffort or Burstable with no ephemeral-storage requests: the kubelet's choice is close to random for you."
  - title: "Image clean-up comes before eviction"
    why: "Before evicting for imagefs, and whenever the image disk passes imageGCHighThresholdPercent (85 % on k8server), the kubelet deletes unused images until usage is below imageGCLowThresholdPercent (80 %). Unused means no running container: images of stopped, crash-looping or evicted pods go too, and a local-only image cannot be pulled back."
    command: "journalctl -u k3s --since -24h | grep -E 'image_gc_manager|Image garbage collection' | tail   # on the node <node>"
    kubemap: "logs"
    good: "No image clean-up, or only images that a registry still has."
    bad: "Image clean-up runs often: the disk is too full; local-only images are at risk (the image pull scenario)."
  - title: "Where are these settings made, and who else needs to know them?"
    why: "On k3s the kubelet flags come from the k3s service (--kubelet-arg) or /etc/rancher/k3s/config.yaml. Monitoring and Kubemap cannot read configz without cluster-admin, so tell them: the Kubemap cluster agent takes KUBEMAP_EVICTION_HARD and KUBEMAP_EVICTION_MINIMUM_RECLAIM in the kubelet's own syntax."
    command: "ssh <node> 'grep -h kubelet-arg /etc/systemd/system/k3s.service /etc/rancher/k3s/config.yaml 2>/dev/null'"
    kubemap: "findings"
    good: "The settings are written down in one place and match what the alerts assume."
    bad: "Defaults assumed in alerts, custom values on the node: the alerts fire too late or too early."
causes:
  - cause: "Minimum reclaim is large compared with the free space a cleanup can reach, so eviction goes on long after the trigger (28 Sep 2026: evicted until 15 % although the disk had recovered to 13.7 %)."
    fix: "Keep the disk far from the trigger (separate disk, caches elsewhere), or lower evictionMinimumReclaim knowingly."
    prove: "kubectl get --raw /api/v1/nodes/<node>/proxy/configz | jq .kubeletconfig.evictionMinimumReclaim"
  - cause: "No memory.available threshold and no reserves (allocatable memory equals capacity), so the kernel OOM killer acts instead of the kubelet."
    fix: "Add memory.available (for example 500Mi) to evictionHard, and set system-reserved and kube-reserved."
    prove: "kubectl get node <node> -o jsonpath='{.status.allocatable.memory}'   # below capacity"
  - cause: "No soft thresholds, so there is no warning time before hard eviction."
    fix: "Add evictionSoft with a grace period a little above evictionHard, and alert on the soft threshold."
    prove: "kubectl get --raw /api/v1/nodes/<node>/proxy/configz | jq .kubeletconfig.evictionSoft"
  - cause: "Alerts and tools assume the kubelet defaults while the node has custom thresholds."
    fix: "Write the thresholds down next to the alert rules; give them to Kubemap (KUBEMAP_EVICTION_HARD, KUBEMAP_EVICTION_MINIMUM_RECLAIM)."
    prove: "The problem finder shows 'thresholds: agent settings' with the node's values"
prevention:
  - "Every eviction signal set on purpose (memory.available, nodefs, imagefs, inodes), plus system-reserved and kube-reserved"
  - "Soft thresholds with a grace period, and alerts at the soft threshold, not at the hard one"
  - "ephemeral-storage requests and priority classes, so the kubelet evicts the right pods first"
  - "The node's settings written down in the repository that holds the alert rules"
senior:
  - "Eviction does not stop at the threshold: it stops at threshold plus minimum reclaim. That is why the 28 Sep incident outlasted the disk problem."
  - "If allocatable memory equals capacity, the node has no memory eviction and no reserves: the first line of defence is the kernel OOM killer, which is a worse one."
  - "Soft thresholds give time to react; hard thresholds are the last resort. I alert on the first, not the second."
  - "Tools must know the real thresholds; defaults in dashboards are a silent lie on a tuned node."
