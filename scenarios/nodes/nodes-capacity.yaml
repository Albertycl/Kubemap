# KM-85. Placeholders: <node>, <ns> and $node. Numbers quoted are k8server's
# on 28 Sep 2026.
id: nodes-capacity
area: nodes
title: "How much capacity is left?"
question: "Can this cluster take one more app, and how much headroom do we really have?"
symptoms:
  - "A new app or more replicas are planned"
  - "Pods stay Pending with 'Insufficient cpu' or 'Insufficient memory', or nodes feel full while requests look low"
  - "Somebody asks 'what happens if a node dies?'"
steps:
  - title: "Capacity, allocatable and reserves"
    why: "Allocatable is what the scheduler may hand out: capacity minus system-reserved, kube-reserved and the memory eviction threshold. If allocatable equals capacity, nothing is kept for the OS, k3s and containerd, and pods can be scheduled into memory the system needs. k8server: 4 CPUs, 11.6 GiB, allocatable equal to capacity."
    command: "kubectl get nodes -o custom-columns=NODE:.metadata.name,CPU:.status.capacity.cpu,CPU_ALLOC:.status.allocatable.cpu,MEM:.status.capacity.memory,MEM_ALLOC:.status.allocatable.memory,PODS:.status.allocatable.pods"
    kubemap: "node"
    check: {op: "node.pressure"}
    good: "Allocatable is below capacity by sensible reserves."
    bad: "Allocatable equals capacity: the headroom numbers below are too optimistic; add reserves."
  - title: "Requests and limits against allocatable"
    why: "The scheduler counts requests. Limits above 100 % mean overcommit: fine for CPU (it is shared), risky for memory (it is not). k8server: requests 27 % CPU and 21 % memory, limits 93 % and 62 %."
    command: "kubectl describe node <node> | grep -A8 'Allocated resources'"
    kubemap: "node"
    good: "Requests leave room for the new app, and memory limits stay under 100 %."
    bad: "Requests near 100 %: nothing more fits. Memory limits far above 100 %: several pods growing at once will cause OOM kills."
  - title: "Real use against requests"
    why: "Requests are only as good as the numbers people wrote. If real use is far above requests, the node is fuller than the scheduler thinks. k8server: 44 % CPU and 68 % memory used against 27 % and 21 % requested."
    command: "kubectl top node; kubectl top pods -A --sort-by=memory | head -10"
    kubemap: "node"
    good: "Use is close to requests, with room to spare."
    bad: "Use is far above requests: plan with real use, and raise the requests of the biggest users."
  - title: "Pods that are invisible to the plan"
    why: "Containers without requests count as zero for the scheduler, but they use real memory and CPU. k8server on 28 Sep: 35 running containers had no memory request."
    command: |-
      kubectl get pods -A -o json | jq -r '.items[] | select(.status.phase=="Running") | .metadata.namespace as $n | .metadata.name as $p | .spec.containers[] | select(.resources.requests.memory == null) | "\($n)/\($p) \(.name)"' | head -20
    kubemap: "findings"
    good: "Every container has a memory request."
    bad: "Many do not: capacity numbers are guesses until they do (a LimitRange gives defaults)."
  - title: "Other limits: pods per node, quotas, disk"
    why: "A node also runs out of pod slots (maxPods, 110 by default; k8server runs about 50), of IP addresses in its pod CIDR, and of disk before the eviction threshold. Namespace quotas cap what one team can take."
    command: "kubectl get pods -A --field-selector spec.nodeName=<node>,status.phase=Running --no-headers | wc -l; kubectl get resourcequota -A; ssh <node> 'df -h /'"
    kubemap: "node"
    good: "Pod slots, quotas and disk all have room."
    bad: "One of them is near its limit: that is the real ceiling, whatever the CPU and memory say."
  - title: "What happens if the biggest node fails? (N+1)"
    why: "Headroom only counts if the cluster survives losing a node: the pods of the largest node must fit on the others. On a single-node cluster like k8server there is no N+1: any node failure is a full outage, and the capacity question is also a resilience question."
    command: "kubectl get nodes; kubectl describe nodes | grep -E '^Name:|cpu  |memory  '"
    kubemap: "node"
    good: "The requests of any one node fit into the free allocatable of the others."
    bad: "They do not (or there is one node): a node failure leaves pods Pending; plan another node before adding apps."
causes:
  - cause: "No reserves: allocatable equals capacity, so pods can be scheduled into memory the system needs (k8server)."
    fix: "Set system-reserved and kube-reserved, and a memory.available eviction threshold."
    prove: "kubectl get node <node> -o jsonpath='{.status.allocatable.memory}'   # below capacity"
  - cause: "Requests far below real use, so the scheduler overfills nodes."
    fix: "Set requests from measured use (kubectl top, VPA recommendations); review them each quarter."
    prove: "kubectl describe node <node> | grep -A8 'Allocated resources'   # requests close to kubectl top"
  - cause: "Containers without requests (invisible to the scheduler)."
    fix: "Add requests; a LimitRange per namespace gives defaults."
    prove: "The problem finder no longer lists pods without memory limits"
  - cause: "No spare node: one failure means an outage."
    fix: "Plan N+1: enough nodes that the largest one's pods fit on the others."
    prove: "kubectl get nodes   # more than one Ready node, and a drain of one leaves no pod Pending"
prevention:
  - "A capacity report: requests, limits and real use against allocatable, per node, each month"
  - "Alerts when requests pass 80 % of allocatable, and when real use passes it"
  - "Requests on every container (LimitRange), and reserves on every node"
  - "N+1 nodes for production, tested with a drain"
senior:
  - "I answer with three numbers: requested, really used, and what is left if the biggest node dies."
  - "CPU can be overcommitted, memory cannot: the first gets slow, the second gets killed."
  - "On k8server the scheduler's picture is too rosy: no reserves, 35 containers without memory requests, and real memory use three times the requests."
  - "What I would automate: a monthly capacity report from these commands, and an alert on requests above 80 % of allocatable."
lab: "kubemap-demo/pending"
