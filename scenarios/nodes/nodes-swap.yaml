# KM-85. Placeholders: <node> and $node.
id: nodes-swap
area: nodes
title: "Swap is full on a node"
question: "The node's swap is full. Is that a problem, and what do you do?"
symptoms:
  - "free -h shows swap used close to total (k8server, 28 Sep 2026: 4.0 GiB of 4.0 GiB used, a few MiB left)"
  - "Everything feels slow at times; memory or I/O pressure rises"
  - "Kubernetes shows no MemoryPressure at all"
steps:
  - title: "How full is swap, and how much RAM is still available?"
    why: "Full swap alone is not an emergency: the kernel may have moved idle pages out long ago. It becomes one when RAM available is low too, because then the next spike has nowhere to go and the OOM killer acts. Look at both numbers together."
    command: "ssh <node> 'free -h; swapon --show'"
    kubemap: "findings"
    check: {op: "node.pressure", args: {node: "$node"}}
    good: "Swap full but RAM available above 20 %: old idle pages; watch, do not panic."
    bad: "Swap full and RAM available low: act now (find the memory users, below)."
  - title: "Is the node actively swapping now?"
    why: "Pages that sit in swap cost nothing; pages that move in and out cost disk I/O and make processes stall. vmstat's si and so columns (KB per second swapped in and out) and memory PSI show whether swapping hurts now."
    command: "ssh <node> 'vmstat 5 5; cat /proc/pressure/memory'"
    kubemap: "node"
    good: "si and so near 0, memory PSI some below 10 %."
    bad: "Sustained si/so and memory PSI above 10 %: processes are waiting for memory; see who uses it."
  - title: "Who is in swap: pods or host processes?"
    why: "The kubelet reports swap per pod; host processes (build tools, editors, agents outside Kubernetes) are not in that list. On k8server on 28 Sep the pods held only kilobytes of swap: the 4 GiB belonged to processes outside Kubernetes."
    command: |-
      kubectl get --raw /api/v1/nodes/<node>/proxy/stats/summary | jq -c '[.pods[] | {pod: (.podRef.namespace + "/" + .podRef.name), swap: (.swap.swapUsageBytes // 0)}] | sort_by(.swap) | reverse | .[:5]'; ssh <node> 'for f in /proc/[0-9]*/status; do awk "/^Name|^VmSwap/ {printf \"%s \", \$2} END {print \"\"}" $f; done 2>/dev/null | sort -k2 -n | tail -5'
    kubemap: "node"
    good: "You know the top swap users and whether Kubernetes controls them."
    bad: "Host processes outside Kubernetes hold the swap: Kubernetes limits cannot help; limit or move those processes."
  - title: "Can pods use swap at all on this node?"
    why: "Kubernetes 1.34 lets pods use swap only with swapBehavior LimitedSwap (and only Burstable pods); the default NoSwap keeps pods out of swap even if the node has it. failSwapOn false lets the kubelet start with swap on. So on a default node, swap is used by the host, not by pods."
    command: "kubectl get --raw /api/v1/nodes/<node>/proxy/configz | jq '.kubeletconfig | {failSwapOn, memorySwap}'"
    kubemap: "node"
    good: "memorySwap is empty or NoSwap: pods do not swap; the host does."
    bad: "LimitedSwap: pods may swap; their latency can suffer without any OOM kill."
  - title: "How much memory room is there for pods?"
    why: "If the host's own processes use swap, they also use RAM that the scheduler thinks is free for pods: with no system-reserved, allocatable equals capacity and the scheduler plans with memory the host is using. That is how a node ends up overcommitted."
    command: "kubectl describe node <node> | grep -A8 'Allocated resources'; kubectl top node <node>"
    kubemap: "node"
    good: "Actual use and requests leave room below capacity."
    bad: "Actual use far above requests, or the host uses gigabytes the scheduler does not know about: reserve it (system-reserved) or reduce it."
causes:
  - cause: "Host processes outside Kubernetes (builds, IDE servers, agents) use more memory than the machine has (k8server, 28 Sep 2026)."
    fix: "Limit them (systemd MemoryMax, fewer parallel builds), move them to another machine, or add RAM; reserve their memory with system-reserved."
    prove: "free -h   # swap used falling, RAM available above 20 %"
  - cause: "Pods without memory limits grow and push other pages to swap."
    fix: "Set memory requests and limits (the problem finder lists pods without them)."
    prove: "kubectl top pods -A --sort-by=memory   # the top users are within their limits"
  - cause: "A memory leak in a long-running process."
    fix: "Restart it as a stopgap, then fix the leak."
    prove: "ps -o rss= -p <pid> over time   # flat"
  - cause: "Swap is small for the workload (4 GiB on k8server), so it fills even with ordinary idle pages."
    fix: "Accept a full swap when RAM is available, or size swap on purpose; do not turn it off during an incident."
    prove: "vmstat 5 5   # si/so near 0"
prevention:
  - "system-reserved sized for what the host really runs, so the scheduler does not hand the same memory to pods"
  - "Build and development workloads off the Kubernetes node, or under a systemd memory limit"
  - "Alert on RAM available together with swap used, not on swap alone"
  - "Memory limits on every pod (LimitRange defaults)"
senior:
  - "Full swap is a symptom; I look at RAM available and active swapping (si/so, memory PSI) before I call it an incident."
  - "Kubernetes does not see host processes: if they own the swap, the fix is outside Kubernetes."
  - "I would not run swapoff in an incident: it forces every swapped page back into RAM at once and can trigger the OOM killer."
  - "What I would automate: an alert on RAM available below 10 % with swap above 90 %, and a monthly check of what the host runs besides Kubernetes."
