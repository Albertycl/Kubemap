# KM-85. Placeholders: <node> and $node.
id: nodes-psi
area: nodes
title: "Everything is slow, but Kubernetes says the node is fine"
question: "Users say the apps are slow, yet every node is Ready with no pressure condition. What do you check?"
symptoms:
  - "Higher latency and timeouts in several apps on the same node; no errors, no restarts"
  - "Node conditions all False, kubectl top shows the CPUs are not at 100 %"
  - "k8server, 28 Sep 2026: tasks waited for CPU 25 to 50 % of the time while Kubernetes reported all clear"
steps:
  - title: "What do Kubernetes' conditions cover, and what not?"
    why: "The kubelet reports MemoryPressure, DiskPressure and PIDPressure only, and only when an eviction threshold is crossed. There is no CPU or I/O condition. A node can be badly overloaded and still show nothing."
    command: "kubectl describe node <node> | sed -n '/Conditions/,/Addresses/p'"
    kubemap: "node"
    check: {op: "node.pressure", args: {node: "$node"}}
    good: "Kubemap's pressure check (conditions plus PSI) shows no resource under pressure."
    bad: "CPU or I/O pressure that the conditions do not show: continue with PSI."
  - title: "Read pressure stall information (PSI)"
    why: "PSI measures how much of the time tasks were stalled waiting for CPU, memory or I/O, over 10 s, 60 s and 300 s. 'some' means at least one task waited; 'full' means all were stalled at once. Rough guide: some above 10 % is noticeable, above 25 % hurts, full above 5 % means no progress at times."
    command: "ssh <node> 'grep -H . /proc/pressure/cpu /proc/pressure/memory /proc/pressure/io'"
    kubemap: "node"
    good: "some avg60 below 10 % for cpu, memory and io."
    bad: "cpu some above 25 %: CPU contention. memory some or full high: reclaim or swap. io full high: disk too slow."
  - title: "CPU contention: who uses the CPU?"
    why: "Contention comes from the sum of all work on the node, including processes outside Kubernetes. Requests are only a scheduling promise, so pods with small requests can use all idle CPU, and host processes (builds) compete with every pod."
    command: "kubectl top pods -A --sort-by=cpu | head -10; ssh <node> 'uptime; nproc; top -b -n1 -o %CPU | head -15'"
    kubemap: "node"
    good: "The load is spread and below the number of CPUs."
    bad: "Load average above the CPU count, and one pod or host process takes most of it: limit or move it."
  - title: "Throttling: a pod slowed by its own CPU limit"
    why: "A container with a CPU limit is throttled when it uses its quota inside a 100 ms period, even on an idle node. That also shows as latency, but only for that pod, and the node's PSI stays low. The pod's own PSI and its CPU against its limit show it."
    command: |-
      kubectl get --raw /api/v1/nodes/<node>/proxy/stats/summary | jq -c '[.pods[] | {pod: (.podRef.namespace + "/" + .podRef.name), cpuSomeAvg60: .cpu.psi.some.avg60}] | sort_by(.cpuSomeAvg60) | reverse | .[:5]'
    kubemap: "pod"
    good: "No pod waits much for CPU on its own."
    bad: "One pod waits a lot while the node does not: its CPU limit is too low; raise or remove it (keep the request)."
  - title: "Memory and I/O stalls"
    why: "Memory PSI rises when the kernel reclaims page cache or swaps; I/O PSI when processes wait for the disk (heavy writes, swapping, a slow volume). Both slow everything on the node without any error."
    command: "ssh <node> 'vmstat 5 5; iostat -x 5 2 2>/dev/null | tail -15'"
    kubemap: "node"
    good: "No swapping (si/so near 0), disk utilisation and wait times normal."
    bad: "Swapping or a saturated disk: see the swap scenario, or move the I/O-heavy job."
  - title: "Requests against reality"
    why: "If actual use is far above what the pods request, the scheduler keeps adding pods to a node that is already busy. k8server on 28 Sep: pods requested 27 % of the CPU and 21 % of the memory, but used 44 % and 68 %."
    command: "kubectl describe node <node> | grep -A8 'Allocated resources'; kubectl top node <node>"
    kubemap: "findings"
    good: "Requests are close to real use."
    bad: "Use far above requests: raise requests to real use, so the scheduler stops overfilling the node."
causes:
  - cause: "CPU oversubscription: pods and host processes want more CPU than the node has (k8server, 28 Sep 2026, with parallel builds)."
    fix: "Move heavy host work (builds) off the node or run it with lower priority (nice, systemd CPUWeight); set CPU requests to real use."
    prove: "cat /proc/pressure/cpu   # some avg60 below 10"
  - cause: "A noisy neighbour without limits takes the CPU or disk."
    fix: "Set requests and limits on it, or give it its own node."
    prove: "kubectl top pods -A --sort-by=cpu | head   # no single pod dominates"
  - cause: "A CPU limit throttles one app, while the node is fine."
    fix: "Raise or remove the CPU limit; keep the request so scheduling stays right."
    prove: "kubectl get --raw /api/v1/nodes/<node>/proxy/stats/summary | jq '.pods[].cpu.psi.some.avg60'   # low for that pod"
  - cause: "Swapping or a slow disk (memory and I/O stalls)."
    fix: "Reduce memory use or add RAM; move I/O-heavy work to a faster or separate disk."
    prove: "vmstat 5 5   # si/so near 0"
prevention:
  - "PSI as a node metric and alert (node_exporter exposes node_pressure_*), next to the kubelet's conditions"
  - "Requests from measured use, so the scheduler's picture matches reality"
  - "No builds or other heavy host work on production nodes"
  - "Latency SLOs per app, so slowness is noticed before users report it"
senior:
  - "Kubernetes has no CPU pressure condition. 'All nodes Ready' tells me nothing about contention; PSI does."
  - "I tell node-wide contention (node PSI high) from per-pod throttling (pod PSI high, node PSI low); the fixes are different."
  - "Requests are a promise for scheduling, not a guarantee at runtime: pods with tiny requests on a busy node all get slow together."
  - "What I would automate: an alert on cpu some avg60 above 25 % for 10 minutes, and a weekly report of requests against real use."
