# KM-86. Placeholders: <ns> <from> <fromns> <svc> <port> in commands; the
# same as $ns $from $fromns $svc $port in the check. <from> is the source
# pod. Every step only reads.
id: security-netpol
area: security
title: "A NetworkPolicy blocks traffic, or does not block what you expected"
question: "Traffic between pods times out, or a policy you wrote does not do what you meant. How do NetworkPolicies really work?"
symptoms:
  - "Connections time out (packets dropped), not 'connection refused'"
  - "It broke right after a NetworkPolicy change, or after a pod got new labels"
  - "A 'deny' policy also blocks things it was never meant to touch, such as the internet or the API server"
steps:
  - title: "Is the connection allowed, and which policy decides?"
    why: "A connection must be allowed at both ends: egress at the source pod and ingress at the destination pod. The check evaluates every policy in both namespaces and names the one that isolates the pod. In the practice lab the frontend's calls to api time out because api-allow-monitoring-only admits only pods labelled role=monitoring."
    command: "kubectl -n <fromns> get networkpolicy; kubectl -n <ns> get networkpolicy"
    kubemap: "netpol"
    check: {op: "netpol.check", args: {fromNamespace: "$fromns", fromPod: "$from", toNamespace: "$ns", toService: "$svc", port: "$port"}}
    good: "Allowed at both ends, with the rule that allows it."
    bad: "Blocked: the check names the side (egress or ingress) and the policies that isolate the pod. Read those in the next steps."
  - title: "Which policies select the pod, and for which direction?"
    why: "Policies are allow-lists. A pod is open in a direction until the first policy that selects it with that policyType; from then on only what some rule allows gets through. policyTypes defaults to Ingress, plus Egress when the policy has egress rules. There is no deny rule: 'default-deny-ingress' is simply a policy that selects every pod and allows nothing."
    command: "kubectl -n <ns> get networkpolicy -o custom-columns='NAME:.metadata.name,SELECTOR:.spec.podSelector,TYPES:.spec.policyTypes'; kubectl -n <ns> get pods --show-labels"
    kubemap: "netpol"
    good: "You can name every policy that selects the pod, and what each allows."
    bad: "A policy selects the pod that you did not expect (an empty podSelector selects every pod in the namespace)."
  - title: "Do the selectors match what you think? Pods only, and AND versus OR."
    why: "podSelector and namespaceSelector match pods only; they never match the internet, a node, the API server or any IP outside the pod network. And one dash decides a lot: namespaceSelector and podSelector in the same list item mean both must match (AND); as two list items they mean either (OR), which can open a whole namespace by accident."
    command: "kubectl -n <ns> get networkpolicy -o yaml"
    kubemap: "netpol"
    good: "Every from or to item says exactly what you mean, with AND where you want both conditions."
    bad: "A separate '- podSelector' item that should have been part of the namespaceSelector item, or a selector meant to cover external IPs."
  - title: "Does an egress policy cut off things outside the pod network?"
    why: "On this cluster sre-lab-app/deny-egress-to-argocd selects every pod and allows egress only to namespaceSelector NotIn [argocd]. It was meant as 'everything except Argo CD', but a namespaceSelector matches only pods. So every pod without another egress policy also lost the internet and the Kubernetes API server (192.168.32.36:6443 behind the kubernetes Service), while DNS still works because CoreDNS runs as pods. Only an ipBlock matches addresses outside the pod network."
    command: "kubectl -n <ns> get networkpolicy -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.spec.policyTypes}{\"\\t\"}{.spec.egress}{\"\\n\"}{end}'; kubectl -n default get endpointslices -l kubernetes.io/service-name=kubernetes"
    kubemap: "netpol"
    good: "Every egress-isolated pod that needs the internet or the API has an ipBlock rule for it."
    bad: "Egress rules with only selectors on pods that need external or API access: add an ipBlock rule (for example 0.0.0.0/0 with except for private ranges), or narrow the policy's podSelector."
  - title: "Are ipBlocks safe with this cluster's addresses?"
    why: "Calico matches ipBlock against pod IPs too, and this cluster's pod pool is 192.168.0.0/16, which overlaps the home network 192.168.32.0/24 (the node 192.168.32.36, the Kubemap portal 192.168.32.32). A rule 'egress to 0.0.0.0/0 except 192.168.0.0/16', meant to force pod-to-pod traffic through Services, would also cut every pod off from the node and the portal. And a pod that ever got an address in 192.168.32.0/24 would clash with a LAN host. Host-network pods (calico-node, the MetalLB speaker, node-exporter and others) show the node's own IP and are expected: the check leaves them out."
    command: "kubectl get ippools.crd.projectcalico.org -o custom-columns=NAME:.metadata.name,CIDR:.spec.cidr; kubectl get pods -A -o custom-columns='NS:.metadata.namespace,POD:.metadata.name,IP:.status.podIP,HOSTNET:.spec.hostNetwork' | awk '$3 ~ /^192\\.168\\.32\\./ && $4 != \"true\"'"
    kubemap: "node"
    good: "No ipBlock in a policy overlaps the pod pool by accident, and the second command prints nothing: no pod-network pod has a LAN address."
    bad: "An ipBlock or except covers both pods and LAN hosts: split the rule, and plan a pod pool that does not overlap the LAN."
  - title: "Is it a NetworkPolicy at all?"
    why: "Some traffic ignores pod policies: host-network pods and the kubelet's probes come from the node. And a timeout can be a missing Service endpoint, a wrong port or a slow app. Rule those out before editing policies."
    command: "kubectl -n <ns> get endpointslices -l kubernetes.io/service-name=<svc>; kubectl -n <ns> get pods -o wide"
    kubemap: "app-map"
    check: {op: "service.check", args: {namespace: "$ns", service: "$svc"}}
    good: "The Service has ready endpoints on the right port: the policy check from step 1 is the answer."
    bad: "No ready endpoints or a wrong port: that is not a NetworkPolicy problem (see traffic-503)."
causes:
  - cause: "The destination is isolated for ingress and no rule allows the source (the lab's api-allow-monitoring-only)."
    fix: "Add the source to the policy's from list (with AND where both namespace and pod must match)."
    prove: "Kubemap's NetworkPolicy check from the source pod to the Service shows allowed."
  - cause: "An egress policy with only selectors cuts off the internet and the API server (deny-egress-to-argocd)."
    fix: "Add an ipBlock egress rule for the external addresses the pods need, or select only the pods the policy is for."
    prove: "kubectl -n <ns> get networkpolicy -o yaml | grep -A3 ipBlock"
  - cause: "An OR where an AND was meant opens a whole namespace, or an AND where an OR was meant blocks it."
    fix: "Put namespaceSelector and podSelector in the same list item for AND."
    prove: "kubectl -n <ns> describe networkpolicy   # From: NamespaceSelector … AND PodSelector …"
  - cause: "An ipBlock that overlaps the pod pool (192.168.0.0/16 here) also matches LAN hosts or pods."
    fix: "Use precise CIDRs; plan a pod pool that does not overlap the LAN."
    prove: "kubectl get ippools.crd.projectcalico.org -o custom-columns=CIDR:.spec.cidr"
prevention:
  - "Every policy change tested with a from-to check for the flows that must work: ingress controller to each public Service, apps to DNS and to the API if they call it"
  - "Default deny per namespace, plus named allow rules, reviewed together"
  - "Egress policies written with the external flows listed (ipBlock) from the start"
  - "A pod pool that does not overlap any network the cluster talks to"
senior:
  - "NetworkPolicy is an allow-list with two ends: say 'isolated by' and 'allowed by', never 'denied by'."
  - "Blast radius of a policy change: an empty podSelector touches every pod in the namespace; deny-egress-to-argocd changed the reachability of four apps at once."
  - "Trade-off: strict egress stops data theft and lateral movement, but every external dependency (APIs, DNS, the Kubernetes API) must then be listed and kept up to date."
  - "Timeouts, not errors, are the sign of a policy drop; that is why policy problems show as 504s at the ingress."
  - "What I would automate: a connectivity matrix test in CI (from, to, port, expected) run against every policy change, and an alert when a pod gets an address in a LAN range."
lab: "kubemap-demo/netpol"
