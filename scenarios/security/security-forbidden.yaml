# KM-86. Placeholders: <ns> <pod> <from> <fromns> in commands, $ns $pod in
# check arguments. <from> and <fromns> here name the calling ServiceAccount
# and its namespace. Every step only reads (get, list, auth can-i).
id: security-forbidden
area: security
title: "An app gets 403 Forbidden from the Kubernetes API"
question: "A job or controller logs 'forbidden: ... cannot list resource ...'. What do you do?"
symptoms:
  - "Logs show HTTP 403 and a message like: User \"system:serviceaccount:kubemap-demo:reporter\" cannot list resource \"pods\" in API group \"\" in the namespace \"sre-lab-app\""
  - "The job fails at once and retries; a controller stops reconciling"
  - "It worked in another namespace or cluster, or before a Helm upgrade"
steps:
  - title: "Read the whole 403 message: who, what verb, which resource, where?"
    why: "The API server's message names all four: the identity (user or ServiceAccount), the verb (get, list, watch, create…), the resource with its API group, and the namespace. Most wrong fixes come from skipping this: granting the wrong verb, the wrong group (apps vs \"\"), or the right thing in the wrong namespace. In the practice lab the reporter asks for pods in sre-lab-app, not in its own namespace."
    command: "kubectl -n <ns> logs <pod> --tail=50; kubectl -n <ns> describe pod <pod>"
    kubemap: "debug"
    check: {op: "pod.debug", args: {namespace: "$ns", pod: "$pod"}}
    good: "No 403 in the logs: the problem is elsewhere."
    bad: "A 403 names the identity, verb, resource and namespace: write them down and check each in the next steps."
  - title: "Is it really RBAC? 401, admission and quota also say 'forbidden'."
    why: "A 401 means the token itself was rejected (expired, wrong audience, deleted ServiceAccount): no Role will help. A 403 from an admission step also says forbidden: 'violates PodSecurity \"restricted\"', 'exceeded quota' (kubemap-demo has a ResourceQuota) or a webhook's denial. Only 'cannot <verb> resource' is an RBAC decision."
    command: "kubectl -n <ns> logs <pod> --tail=50 | grep -iE 'forbidden|unauthorized|violates|exceeded quota|denied the request'"
    kubemap: "logs"
    good: "The message is 'cannot <verb> resource …': an RBAC decision, go on."
    bad: "401 Unauthorized: check the token and the ServiceAccount. PodSecurity, quota or webhook: fix the object or the policy, not RBAC."
  - title: "Which identity does the pod really use?"
    why: "A pod runs as its ServiceAccount, 'default' when none is set. A Helm upgrade or a copied manifest often changes serviceAccountName, so the rights you granted belong to another account. automountServiceAccountToken: false means the pod has no token at all."
    command: "kubectl -n <ns> get pod <pod> -o jsonpath='{.spec.serviceAccountName} automount={.spec.automountServiceAccountToken}{\"\\n\"}'"
    kubemap: "pod"
    good: "The ServiceAccount is the one the 403 names, and the one you meant to grant."
    bad: "Another account than you thought: fix serviceAccountName, or grant the right account."
  - title: "Ask the API server the same question: can this account do it?"
    why: "kubectl auth can-i with --as asks exactly what the app asked, without running the app: the verb, the resource and the namespace from step 1. It is the proof before and after any fix. Kubemap answers the same check from its cache with the rbac.whocan op (a subject with a verb and resource) and names the binding that allows it."
    command: "kubectl auth can-i list pods -n <ns> --as=system:serviceaccount:<fromns>:<from>; kubectl auth can-i --list -n <ns> --as=system:serviceaccount:<fromns>:<from>"
    kubemap: "findings"
    good: "yes: the RBAC is right now (a cache or a restarted pod will pick it up)."
    bad: "no: go on to find which binding is missing."
  - title: "Which Roles and bindings does this account have?"
    why: "Rights come only from RoleBindings (one namespace) and ClusterRoleBindings (all namespaces) that name the account, its namespace's group (system:serviceaccounts:<ns>) or all accounts (system:serviceaccounts, system:authenticated). Find what exists before adding anything, so the fix is the smallest one. Kubemap's rbac.whocan op with only the subject lists this whole chain: each binding, how it applies (directly or through which group), its role and rules."
    command: "kubectl get rolebindings,clusterrolebindings -A -o custom-columns='KIND:.kind,NAMESPACE:.metadata.namespace,NAME:.metadata.name,ROLE:.roleRef.name,SUBJECTS:.subjects[*].name' | grep -E '<from>|system:serviceaccounts|system:authenticated'"
    kubemap: "findings"
    good: "A binding gives the needed verb, resource and namespace, and nothing more."
    bad: "No binding for this namespace: the fix is a Role and a RoleBinding in that namespace (or pointing the app at its own namespace)."
  - title: "Is the app asking for the right thing in the right place?"
    why: "Often the RBAC is correct and the app is wrong: a namespace hard-coded in a ConfigMap (the lab's TARGET_NAMESPACE: sre-lab-app), a cluster-wide list where one namespace would do, or a watch on a resource it never needs. Fixing the request is better than widening the rights."
    command: "kubectl -n <ns> get configmap -o yaml | grep -iE 'namespace|target'"
    kubemap: "app-map"
    good: "The app asks only for what it needs in its own namespace."
    bad: "It reaches into another namespace or the whole cluster: change the app or its config first."
causes:
  - cause: "No Role grants the verb and resource in that namespace."
    fix: "A Role with exactly that verb and resource, and a RoleBinding for this ServiceAccount, in that namespace only (kubectl create role … --dry-run=server first)."
    prove: "kubectl auth can-i list pods -n <ns> --as=system:serviceaccount:<fromns>:<from>   # yes"
  - cause: "The app targets the wrong namespace (a config value), so its correct Role does not apply."
    fix: "Point the app at its own namespace; do not grant rights elsewhere to make a config mistake work."
    prove: "kubectl -n <ns> logs <pod> --tail=5   # the result, no 403"
  - cause: "The pod runs as another ServiceAccount than the one that was granted (default, or renamed in an upgrade)."
    fix: "Set serviceAccountName to the granted account."
    prove: "kubectl -n <ns> get pod <pod> -o jsonpath='{.spec.serviceAccountName}'"
  - cause: "The API group is wrong in the Role (\"\" for pods, apps for deployments, batch for jobs)."
    fix: "Use the group from the 403 message."
    prove: "kubectl auth can-i --list -n <ns> --as=system:serviceaccount:<fromns>:<from>"
  - cause: "Not RBAC: 401 (token), PodSecurity, ResourceQuota or an admission webhook."
    fix: "Fix the token or the object; RBAC changes will not help."
    prove: "The message no longer appears in the logs."
prevention:
  - "One ServiceAccount per workload, with automountServiceAccountToken: false unless it calls the API"
  - "Roles written from the calls the app really makes, reviewed with kubectl auth can-i --list in CI"
  - "Namespaced Roles over ClusterRoles; no bindings to system:authenticated or system:serviceaccounts"
  - "Alerts on 403 rates from the API server audit log per ServiceAccount"
senior:
  - "Least privilege is the default answer: grant the one verb on the one resource in the one namespace from the 403, never cluster-admin 'to make it work'."
  - "Blast radius of the fix: a ClusterRoleBinding gives every namespace, including kube-system Secrets if the Role has them; a RoleBinding limits a mistake to one namespace."
  - "A 403 is the system working: the question is whether the app should need this, not only how to grant it."
  - "Escalation paths to review: create pods (mounts any ServiceAccount's token in the namespace), bind, escalate, impersonate and get secrets are as strong as admin."
  - "What I would automate: a CI check that diffs kubectl auth can-i --list per ServiceAccount against an approved list, and an audit-log alert on new 403 sources."
lab: "kubemap-demo/rbacforbidden"
