# KM-86. Placeholders: <ns> <from> <fromns> in commands: <from> is the
# ServiceAccount under review and <fromns> its namespace. Every step only
# reads (get, list, auth can-i).
id: security-least-privilege
area: security
title: "What can this ServiceAccount really do?"
question: "Before an audit, or after an incident: is this account limited to what it needs?"
symptoms:
  - "A workload's ServiceAccount has grown rights over several releases"
  - "Someone asks: could a compromised pod read Secrets, exec into other pods or change RBAC?"
  - "A security review asks you to prove least privilege, not claim it"
steps:
  - title: "List what the account can do in its own namespace"
    why: "kubectl auth can-i --list asks the API server to evaluate every binding for this identity at once, including group bindings you would not find by name. It is the ground truth, not the YAML you think was applied. Kubemap's rbac.whocan op with only the subject gives the same chain, binding by binding, and flags the admin-equivalent rights."
    command: "kubectl auth can-i --list -n <fromns> --as=system:serviceaccount:<fromns>:<from>"
    kubemap: "findings"
    good: "Only the verbs and resources the app uses, plus the self-review and discovery basics every account has."
    bad: "Wildcards (*), secrets, pods/exec, create pods, or RBAC resources: go to step 3."
  - title: "Does it reach other namespaces, or the whole cluster?"
    why: "A ClusterRoleBinding applies everywhere. Ask the same question in a sensitive namespace (kube-system) and cluster-wide. A namespaced app should get 'no' outside its namespace."
    command: "kubectl auth can-i --list -n kube-system --as=system:serviceaccount:<fromns>:<from>; kubectl auth can-i list secrets -A --as=system:serviceaccount:<fromns>:<from>"
    kubemap: "findings"
    good: "no outside its namespace, apart from the cluster-wide basics every account has."
    bad: "Rights in kube-system or across all namespaces: find the ClusterRoleBinding (step 4)."
  - title: "Look for the rights that are as strong as admin"
    why: "Some rights lead to others: get or list secrets reveals every token and password; create pods runs a pod as any ServiceAccount in the namespace and reads its token; pods/exec runs commands in other apps; bind, escalate and impersonate change or borrow identities; nodes/proxy reaches the kubelet API. Any of these makes the account admin-equivalent in its scope. rbac.whocan's chain lists them per binding under risky (read secrets, create pods, exec into pods, change RBAC, bind or escalate, impersonate, nodes/proxy, create tokens, wildcard). On this cluster k3s's helm-traefik and helm-traefik-crd ServiceAccounts keep cluster-admin after the install jobs finished."
    command: "for v in 'get secrets' 'list secrets' 'create pods' 'create pods/exec' 'create rolebindings' 'bind clusterroles' 'impersonate serviceaccounts' 'get nodes/proxy'; do echo \"$v: $(kubectl auth can-i $v -n <fromns> --as=system:serviceaccount:<fromns>:<from>)\"; done"
    kubemap: "findings"
    good: "no for every one."
    bad: "yes for any: remove it unless the app is a controller that truly needs it, and write down why."
  - title: "Which bindings give these rights, and are any for whole groups?"
    why: "Rights reach an account through bindings to it, to its namespace's group (system:serviceaccounts:<ns>) or to everyone (system:serviceaccounts, system:authenticated). On this cluster every authenticated identity has verbs * on Calico's networkpolicies and globalnetworkpolicies, through calico-tiered-policy-passthrough. That is Calico's design: Kubernetes RBAC lets the request through and Calico's API server then checks tier permissions. Know such cases before you flag them."
    command: "kubectl get rolebindings,clusterrolebindings -A -o custom-columns='KIND:.kind,NAMESPACE:.metadata.namespace,NAME:.metadata.name,ROLE:.roleRef.name,SUBJECTS:.subjects[*].name' | grep -E '<from>|system:serviceaccounts|system:authenticated'"
    kubemap: "findings"
    good: "Each right comes from one reviewed binding for this account; group-wide bindings are the known platform ones."
    bad: "A group-wide binding to a strong role, or an old binding nobody owns: remove or narrow it."
  - title: "Does the pod need an API token at all?"
    why: "Most apps never call the Kubernetes API. If a pod mounts a token it does not use, an attacker in the pod gets that identity for free. automountServiceAccountToken: false removes the token; the practice labs set it on every pod that does not call the API."
    command: "kubectl -n <fromns> get pods -o custom-columns='POD:.metadata.name,SA:.spec.serviceAccountName,AUTOMOUNT:.spec.automountServiceAccountToken'"
    kubemap: "pod"
    good: "Only pods that call the API mount a token."
    bad: "Pods mount tokens they never use: set automountServiceAccountToken: false on the pod or the ServiceAccount."
causes:
  - cause: "A ClusterRoleBinding where a RoleBinding would do."
    fix: "Replace it with a Role and RoleBinding in the app's namespace."
    prove: "kubectl auth can-i --list -n kube-system --as=system:serviceaccount:<fromns>:<from>   # only the basics"
  - cause: "Wildcards (* verbs or resources) or aggregated roles (admin, edit) used for convenience."
    fix: "List the verbs and resources the app really uses (the API audit log shows them) and grant only those."
    prove: "kubectl auth can-i --list -n <fromns> --as=system:serviceaccount:<fromns>:<from>   # no *"
  - cause: "A binding to a whole group (system:serviceaccounts:<ns> or system:authenticated)."
    fix: "Bind the named ServiceAccounts that need it instead."
    prove: "kubectl get rolebindings,clusterrolebindings -A -o wide | grep system:serviceaccounts   # only platform bindings"
  - cause: "Tokens mounted into pods that never call the API."
    fix: "automountServiceAccountToken: false."
    prove: "kubectl -n <fromns> get pod -o custom-columns=POD:.metadata.name,AUTOMOUNT:.spec.automountServiceAccountToken"
prevention:
  - "RBAC generated from the calls an app makes (an explicit list, no wildcards), as Kubemap's own agent role is"
  - "A CI diff of kubectl auth can-i --list for every ServiceAccount against an approved baseline"
  - "No bindings to system:authenticated or system:serviceaccounts except reviewed platform ones"
  - "Short-lived projected tokens with an audience instead of long-lived Secret tokens"
senior:
  - "Least privilege is proved with can-i --list, not claimed from YAML: groups and aggregated roles add rights the manifests do not show."
  - "Blast radius: what can an attacker who gets this pod do? Read the answer from step 3, not from the app's purpose."
  - "Trade-off: very narrow roles break on upgrades that add a call; generate them from the audit log and test them in CI, so least privilege stays cheap."
  - "Know your platform's exceptions (Calico's tier passthrough, the discovery and self-review basics) so a review does not raise false alarms."
  - "What I would automate: a weekly report of admin-equivalent rights per ServiceAccount, with an owner for each exception."
lab: "kubemap-demo/rbacforbidden"
