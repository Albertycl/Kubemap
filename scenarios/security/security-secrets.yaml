# KM-86. Placeholders: <ns> <pod> <from> <fromns> in commands; <from> and
# <fromns> name a ServiceAccount to test. Every step only reads, and no step
# prints a Secret's value: metadata, references and counts only.
id: security-secrets
area: security
title: "Could this Secret leak?"
question: "A database password lives in a Secret. Who can read it, and where could its value leak?"
symptoms:
  - "A security review asks who can read the production database password"
  - "A password showed up in a log, a ConfigMap or a support bundle"
  - "After an incident: was the Secret exposed, and must it be rotated?"
steps:
  - title: "Which pods use the Secret, and how: environment variable or file?"
    why: "A Secret reaches an app as an environment variable (secretKeyRef, envFrom) or as a mounted file. Environment variables leak more easily: into crash dumps, debug pages, child processes and logs that print the environment. On this cluster url-shortener gets DB_PASSWORD from postgres-cnpg-secret and REDIS_PASSWORD from redis-auth as environment variables; redis-master mounts redis-auth as a file."
    command: "kubectl -n <ns> get pods -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.spec.containers[*].env[*].valueFrom.secretKeyRef.name}{\"\\t\"}{.spec.volumes[*].secret.secretName}{\"\\n\"}{end}'"
    kubemap: "app-map"
    check: {op: "appmap", args: {namespace: "$ns"}}
    good: "Each Secret is used by the pods that need it, preferably as a file."
    bad: "A Secret in environment variables of many pods, or of a pod that does not need it."
  - title: "Who can read Secrets in this namespace?"
    why: "Read access to Secrets is read access to every password and token in the namespace. It comes from Roles with get, list or watch on secrets, and from aggregated roles such as admin and edit. Test each workload's ServiceAccount; list and watch count too, because they return values. Kubemap's rbac.whocan op asked 'get secrets in this namespace' lists every subject at once: in sre-lab-app that is 22, from cluster-admin and Argo CD to Traefik, Grafana and kube-state-metrics, while the CNPG accounts may read only the Secrets named in their rules."
    command: "kubectl auth can-i get secrets -n <ns> --as=system:serviceaccount:<fromns>:<from>; kubectl auth can-i list secrets -n <ns> --as=system:serviceaccount:<fromns>:<from>"
    kubemap: "findings"
    good: "no for every workload that does not manage Secrets itself."
    bad: "yes for an app's ServiceAccount: remove it; an app gets its own Secret mounted, it does not need to read Secrets."
  - title: "Who can create pods here? They can read every Secret too."
    why: "Anyone who can create a pod in the namespace can mount any Secret into it, or run it as any ServiceAccount and use its token. So 'create pods' (and create deployments, jobs, cronjobs) is as strong as 'get secrets'. This is why Kubemap's agent has only get, list and watch, and no access to Secrets at all."
    command: "kubectl auth can-i create pods -n <ns> --as=system:serviceaccount:<fromns>:<from>; kubectl auth can-i create deployments.apps -n <ns> --as=system:serviceaccount:<fromns>:<from>"
    kubemap: "findings"
    good: "Only deploy pipelines and controllers can create workloads."
    bad: "App ServiceAccounts or broad groups can: remove it, it is an indirect read of every Secret."
  - title: "Does a value leak into logs, ConfigMaps or images?"
    why: "The common leaks are not RBAC: an app that logs its config at start, a password pasted into a ConfigMap (ConfigMaps are readable by far more people and tools, Kubemap's viewers included), or a value baked into an image or a Helm values file in Git. Count matches; never print them."
    command: "kubectl -n <ns> logs <pod> --tail=500 | grep -ciE 'password|passwd|secret|token|api[_-]?key'; kubectl -n <ns> get configmaps -o yaml | grep -ciE 'password|passwd|secret|token|api[_-]?key'"
    kubemap: "logs"
    good: "0 and 0 (or only names of settings, which you check by hand)."
    bad: "Matches: find the line without printing it to a shared screen, remove the value, and rotate the Secret: once it was in a log it must be treated as exposed."
  - title: "How old is the Secret, and who manages it?"
    why: "An exposed Secret is fixed only by rotation, and rotation is only easy if something manages it (an operator such as CloudNativePG, which owns postgres-cnpg-secret here, or an external secret store). Read the metadata, never the data."
    command: "kubectl -n <ns> get secrets -o custom-columns='NAME:.metadata.name,TYPE:.type,CREATED:.metadata.creationTimestamp,OWNER:.metadata.ownerReferences[*].kind'"
    kubemap: "findings"
    good: "Each Secret has an owner or a documented rotation, and a recent enough age."
    bad: "Old, hand-made Secrets with no owner: document them and plan rotation."
  - title: "Are Secrets encrypted at rest?"
    why: "Without encryption at rest, anyone with a copy of the datastore (etcd or k3s's SQLite, or a backup of it) reads every Secret in plain text. k3s records its server flags in the node annotation k3s.io/node-args: on this cluster they show no --secrets-encryption, so Secrets are most likely stored unencrypted. A k3s config file can also set it, so confirm on the server node with sudo k3s secrets-encrypt status."
    command: "kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.metadata.annotations.k3s\\.io/node-args}{\"\\n\"}{end}' | grep -c secrets-encryption"
    kubemap: "node"
    good: "1 or more: the flag is set; sudo k3s secrets-encrypt status on the node says Enabled, with a recent key rotation."
    bad: "0: the flag is not in the node args (this cluster). Confirm on the node; if it is disabled, plan to enable it and re-encrypt, and protect datastore backups meanwhile."
causes:
  - cause: "An app's ServiceAccount can get or list Secrets it does not need."
    fix: "Remove secrets from its Role; mount the one Secret it needs instead."
    prove: "kubectl auth can-i list secrets -n <ns> --as=system:serviceaccount:<fromns>:<from>   # no"
  - cause: "Broad rights to create pods or workloads (an indirect read of every Secret)."
    fix: "Only pipelines and controllers create workloads; apps and people get read access."
    prove: "kubectl auth can-i create pods -n <ns> --as=system:serviceaccount:<fromns>:<from>   # no"
  - cause: "A value printed in logs or stored in a ConfigMap."
    fix: "Remove it, stop the app from printing its config, and rotate the Secret."
    prove: "kubectl -n <ns> logs <pod> --tail=500 | grep -ciE 'password|token'   # 0"
  - cause: "Secrets passed as environment variables to many pods."
    fix: "Mount them as files, read by the one container that needs them."
    prove: "kubectl -n <ns> get pods -o jsonpath='{.items[*].spec.containers[*].env[*].valueFrom.secretKeyRef.name}'   # empty or minimal"
prevention:
  - "No get, list or watch on secrets for app ServiceAccounts; audit who can create workloads"
  - "Secrets mounted as files, with an operator or external store that rotates them"
  - "Encryption at rest on, and datastore backups treated as secret material"
  - "A CI scan for secrets in manifests, ConfigMaps and images; apps that never log their configuration"
senior:
  - "Treat 'was it exposed?' as 'yes' once a value reached a log, a ConfigMap or a screen share; rotation is the only real fix."
  - "Blast radius: a leaked database password reaches everything that database stores; a leaked ServiceAccount token reaches whatever its RBAC allows, until it expires."
  - "Indirect reads matter as much as direct ones: create pods, exec and node access all reach Secrets."
  - "Trade-off: environment variables are simple and portable, files are safer and can be rotated without a restart when the app rereads them."
  - "What I would automate: rotation on a schedule by an operator, a secret scanner on every commit and log stream, and an alert when a new ServiceAccount gains read access to secrets."
