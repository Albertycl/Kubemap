# KM-88. Placeholders: <ns>, <cert>, <host>. k8server facts (28 Sep 2026):
# cert-manager with ClusterIssuer lab-ca-issuer (a lab CA, lab-ca, that
# expires on 11 Nov 2026 and renews on 12 Oct), Certificates url-shortener-tls
# and whoami-tls in sre-lab-app.
id: traffic-certificate-expiry
area: traffic
title: "A TLS certificate is about to expire, or has expired"
question: "Browsers or clients report an expired or untrusted certificate, or an alert says one expires soon. What do you do?"
symptoms:
  - "Browsers show NET::ERR_CERT_DATE_INVALID; clients log 'x509: certificate has expired or is not yet valid'"
  - "Only some clients fail (the ones that check the chain or pin a CA)"
  - "An alert on certificate expiry, or cert-manager Certificates not Ready"
steps:
  - title: "Which certificate is served, and when does it expire?"
    why: "Look at what the endpoint really serves, not at what you think is deployed: the ingress may serve its default certificate, an old Secret, or a different host's certificate."
    command: "echo | openssl s_client -connect <host>:443 -servername <host> 2>/dev/null | openssl x509 -noout -subject -issuer -dates   # from a machine that reaches the host"
    kubemap: "app-map"
    check: {op: "appmap", args: {namespace: "$ns"}}
    good: "The subject and issuer are the expected ones, and notAfter is well in the future."
    bad: "Expired, the wrong subject, or Traefik's default certificate: find the Certificate and Secret behind the route."
  - title: "What does cert-manager say about the Certificate?"
    why: "cert-manager renews a Certificate at its renewalTime (by default a third of the lifetime before expiry, for example 30 days for a 90-day certificate). If it has not renewed, its conditions and the CertificateRequest say why."
    command: "kubectl -n <ns> get certificate <cert> -o 'custom-columns=NAME:.metadata.name,READY:.status.conditions[0].status,NOT_AFTER:.status.notAfter,RENEW:.status.renewalTime,ISSUER:.spec.issuerRef.name'; kubectl -n <ns> describe certificate <cert> | sed -n '/Events/,$p'"
    kubemap: "findings"
    good: "Ready True and renewalTime in the future: cert-manager will renew in time."
    bad: "Ready False, or renewalTime has passed without a renewal: look at the request and the issuer (next step)."
  - title: "Why did the renewal fail? Request, order, issuer"
    why: "A renewal creates a CertificateRequest; with ACME also an Order and Challenges. A failed HTTP-01 challenge (the ingress does not route /.well-known/acme-challenge), a DNS-01 permission error, a rate limit, or an issuer that is not Ready all stop it."
    command: "kubectl -n <ns> get certificaterequest,order,challenge 2>/dev/null; kubectl get clusterissuer,issuer -A; kubectl -n cert-manager logs deploy/cert-manager --since=1h | grep -iE 'error|fail' | tail -20"
    kubemap: "logs"
    good: "The latest CertificateRequest is Approved and Ready."
    bad: "A challenge is pending or failed, or the issuer is not Ready: its message names the cause."
  - title: "Is the chain valid: does the issuing CA itself expire?"
    why: "A leaf certificate is only valid while every certificate above it is. On k8server the lab CA (lab-ca) expires on 11 Nov 2026 while url-shortener-tls runs to June 2027: clients that trust the old CA certificate must get the renewed CA certificate before then, or they reject the leaf."
    command: "kubectl get certificates -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,NOT_AFTER:.status.notAfter,ISSUER:.spec.issuerRef.name"
    kubemap: "findings"
    good: "Every CA in the chain outlives the leaves it signs, and clients have the current CA certificate."
    bad: "A CA expires before its leaves: plan the CA renewal and the trust update now."
  - title: "Is the new certificate actually served?"
    why: "cert-manager writes the new certificate into the Secret; the ingress controller must pick it up. Traefik watches Secrets and reloads, but an app that mounts the Secret as a file and reads it only at start keeps serving the old one until it restarts."
    command: "kubectl -n <ns> get secret $(kubectl -n <ns> get certificate <cert> -o jsonpath='{.spec.secretName}') -o jsonpath='{.data.tls\\.crt}' | base64 -d | openssl x509 -noout -dates   # only the public certificate; compare with openssl s_client"
    kubemap: "pod"
    good: "The Secret and the served certificate have the same dates."
    bad: "The Secret is new, the served certificate old: restart the app or ingress that caches it."
causes:
  - cause: "An ACME challenge fails (the ingress does not route the challenge path, DNS-01 credentials expired)."
    fix: "Fix the route or the DNS credentials; delete the failed Order so cert-manager retries."
    prove: "kubectl -n <ns> get certificate <cert>   # READY True, NOT_AFTER moved"
  - cause: "The issuer or ClusterIssuer is not Ready (a rotated account key, a deleted CA Secret)."
    fix: "Repair the issuer's Secret or configuration."
    prove: "kubectl get clusterissuer   # READY True"
  - cause: "A private CA expires before its leaf certificates (k8server: lab-ca on 11 Nov 2026)."
    fix: "Renew the CA ahead of time (cert-manager keeps the key by default, so existing leaves stay valid) and distribute the new CA certificate to every client that trusts it."
    prove: "kubectl -n cert-manager get certificate lab-ca -o jsonpath='{.status.notAfter}'   # later date"
  - cause: "The certificate was renewed but an app still serves the old one from memory."
    fix: "Restart it, or make it reload on Secret change."
    prove: "openssl s_client … | openssl x509 -noout -dates   # new dates"
  - cause: "The certificate was made by hand (not by cert-manager) and nobody renewed it."
    fix: "Replace it with a cert-manager Certificate, so renewal is automatic."
    prove: "kubectl -n <ns> get certificate   # a Certificate owns the Secret"
prevention:
  - "Every certificate through cert-manager, none by hand"
  - "Alert on certmanager_certificate_expiration_timestamp_seconds 21 days ahead, and on Certificates not Ready"
  - "An inventory of private CAs with their expiry dates and who trusts them"
  - "A synthetic TLS check per public host that fails at 14 days left"
senior:
  - "I check what is served first: the certificate in the Secret is not always the one the user sees."
  - "Expiry is the easy part; chains and trust stores are what break at 3 a.m. — the CA's date matters as much as the leaf's."
  - "Mitigation: if a renewal is stuck and the deadline is close, issue a short-lived certificate by hand and fix the automation after."
  - "What I would automate: expiry alerts with enough lead time for a weekend and a holiday, and a monthly report of every certificate and CA."
