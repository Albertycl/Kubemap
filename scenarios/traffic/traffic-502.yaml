# KM-83. Placeholders: <ns> <svc> <pod> in commands and $ns $svc $pod in
# check arguments are filled in from the route or Service the scenario is
# started from. Every check only reads.
id: traffic-502
area: traffic
title: "Users get HTTP 502"
question: "The site returns 502 Bad Gateway. What do you do?"
symptoms:
  - "502 Bad Gateway from Traefik, often fast (milliseconds), sometimes only for some requests"
  - "The pods look Running and Ready, and the Service has endpoints"
  - "Often right after a deploy, during a rollout, or under load"
steps:
  - title: "Is it really a 502, and how fast does it come back?"
    why: "The status code and the time tell the layers apart. A 502 means Traefik reached an endpoint and the answer was broken: the connection was refused, reset or closed before a valid HTTP response. It usually comes back in milliseconds. A 503 means there was no ready endpoint at all; a 504 means Traefik waited and gave up. This cluster's lab answers 502 in 13 ms. Replace the host with the failing one; the command only sends a GET."
    command: "curl -s -o /dev/null -w '%{http_code} %{time_total}s\\n' -H 'Host: flask-vue.albertycliu.xyz' http://$(kubectl -n kube-system get svc traefik -o jsonpath='{.status.loadBalancer.ingress[0].ip}')/api/hello"
    good: "200 in milliseconds: the route works now. Look for intermittent 502s (step 5)."
    bad: "502 in milliseconds: continue with step 2. A 502 after exactly your timeout is a slow upstream (see traffic-504)."
  - title: "Which route and Service answer, and does the Service have ready endpoints?"
    why: "Unlike a 503, a 502 needs an endpoint: something accepted the connection. Confirm the route sends the failing host and path to the Service you think, and that it has ready endpoints. On this cluster flask-vue.albertycliu.xyz sends /api to flask-vue-backend and / to flask-vue-frontend: a 502 only on /api points at the backend."
    command: "kubectl -n <ns> get ingressroute,ingress -o wide; kubectl -n <ns> get endpointslices -l kubernetes.io/service-name=<svc>"
    kubemap: "app-map"
    check: {op: "service.check", args: {namespace: "$ns", service: "$svc"}}
    good: "Ready endpoints exist and the Service's targetPort is a port the container declares."
    bad: "No ready endpoints: that is a 503 problem (see traffic-503). A targetPort the container does not declare: step 3."
  - title: "Does the Service send traffic to the port the app really serves HTTP on?"
    why: "A targetPort that points to a port nothing listens on gives 'connection refused', which Traefik reports as 502, while the pod is Ready (its probe checks another port). The same happens when the port speaks another protocol: a metrics port, a gRPC port, or HTTPS where Traefik speaks plain HTTP."
    command: "kubectl -n <ns> get service <svc> -o jsonpath='{.spec.ports}'; kubectl -n <ns> get pod <pod> -o jsonpath='{.spec.containers[*].ports}'"
    kubemap: "app-map"
    good: "targetPort (by name, ideally) is the container's HTTP port, and the scheme matches (http, or a ServersTransport for https)."
    bad: "Wrong port or scheme: fix the Service's targetPort, or tell Traefik the backend speaks https."
  - title: "Is the app crashing or being killed while it serves requests?"
    why: "An app that panics in a handler, or a container killed for memory in the middle of a request, closes the connection without an answer: Traefik returns 502 for exactly those requests. Restarts, exit codes and the previous run's last log lines show it."
    command: "kubectl -n <ns> get pods -o wide; kubectl -n <ns> logs <pod> --previous --tail=100; kubectl -n <ns> describe pod <pod>"
    kubemap: "debug"
    check: {op: "pod.debug", args: {namespace: "$ns", pod: "$pod"}}
    good: "No restarts, no error lines, exit code 0 or none. 'previous terminated container … not found' from logs --previous also means no restart."
    bad: "A panic or error line, or exit 137 (killed for memory), in the previous run: that is the 502. Fix the handler, or raise the limit if usage is really that high."
  - title: "Do the 502s line up with rollouts or pod terminations?"
    why: "Intermittent 502s during a deploy mean pods were stopped while they still had requests: the app exits on SIGTERM at once, or the endpoint is removed after the process already stopped. Kubernetes removes the endpoint and sends SIGTERM at the same time, so the app must keep serving for a few seconds."
    command: "kubectl -n <ns> rollout history deployment; kubectl -n <ns> get events --sort-by=.lastTimestamp | tail -20"
    kubemap: "pod"
    good: "No rollout or termination at the times of the 502s."
    bad: "502s during rollouts: add a preStop sleep (5 to 10 s), handle SIGTERM gracefully, and keep terminationGracePeriodSeconds above the longest request."
  - title: "Does the upstream close idle keep-alive connections before Traefik does?"
    why: "If the app (or a server in front of it) closes idle connections sooner than Traefik expects, Traefik sometimes sends a request on a connection the app just closed: a rare, random 502 under low traffic. The fix is on the timeouts, not in the app code."
    command: "kubectl -n kube-system get deploy traefik -o jsonpath='{.spec.template.spec.containers[0].args}'"
    kubemap: "logs"
    good: "The app's idle timeout is longer than Traefik's idleConnTimeout (90 s by default)."
    bad: "The app closes idle connections sooner (some servers default to a few seconds of keep-alive): raise it above Traefik's, or lower Traefik's in a ServersTransport."
causes:
  - cause: "The app panics or errors in a handler and drops the connection."
    fix: "Fix the handler; let the web framework return a 500 instead of dropping the connection."
    prove: "curl -s -o /dev/null -w '%{http_code}\\n' -H 'Host: demo-502.local' http://192.168.32.240/   # 200 (lab)"
  - cause: "targetPort points to a port nothing listens on, or that speaks another protocol."
    fix: "Set targetPort to the container's HTTP port by name; use a ServersTransport for https backends."
    prove: "kubectl -n <ns> get endpointslices -l kubernetes.io/service-name=<svc> -o jsonpath='{.items[*].ports}'"
  - cause: "Containers are killed for memory mid-request (exit 137)."
    fix: "Raise the memory limit only if usage is really that high; otherwise fix the leak."
    prove: "kubectl -n <ns> get pods   # restarts no longer rising"
  - cause: "Pods stop before their endpoints are removed during rollouts."
    fix: "preStop sleep, graceful SIGTERM handling, and a PodDisruptionBudget."
    prove: "During the next rollout, a load test against the route shows zero 502s (kubectl -n <ns> rollout status deployment/<deploy> to follow it)."
  - cause: "The upstream closes idle keep-alive connections before Traefik."
    fix: "Make the app's idle timeout longer than Traefik's idleConnTimeout, or shorten Traefik's in a ServersTransport."
    prove: "A low-rate load test for 10 minutes shows zero 502s."
prevention:
  - "HTTP readiness probes on a real endpoint (httpGet), not tcpSocket: a port that accepts and closes is 'ready' to tcpSocket"
  - "Graceful shutdown: preStop sleep, SIGTERM handling, terminationGracePeriodSeconds above the longest request"
  - "targetPort by name, reviewed together with the container's ports"
  - "Traefik access logs on (they are off on this cluster), with the upstream error in each 5xx line"
senior:
  - "Blast radius: one route or all? One path (flask-vue /api only) points at one backend; every route at once points at Traefik or the node."
  - "Read the time, not only the code: 502 in milliseconds is a broken upstream, 502 or 504 after a round number of seconds is a timeout."
  - "SLO impact: 502s during every deploy are an availability cost you pay on purpose; say how many per rollout and fix it with graceful shutdown."
  - "Mitigate first: roll back the last deploy if the 502s started with it; debug the handler after users are served."
  - "What I would automate: an alert on the ingress 5xx rate per route, split by status code, and a rollout check that fails on 502s during a canary."
  - "Trade-off: retries in Traefik hide 502s from users but double the load on a sick backend and are unsafe for non-idempotent requests (POST)."
lab: "kubemap-demo/upstream502"
