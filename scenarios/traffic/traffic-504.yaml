# KM-83. Placeholders: <ns> <svc> <pod> <node> in commands; $ns $svc $pod
# $from $fromns $port $node in check arguments. Every check only reads.
id: traffic-504
area: traffic
title: "Users get HTTP 504"
question: "The site returns 504 Gateway Timeout. What do you do?"
symptoms:
  - "504 Gateway Timeout from Traefik, after many seconds, not at once"
  - "Requests hang; some finish, some time out, often under load"
  - "Endpoints are ready and pods are Running"
steps:
  - title: "How long does the request take before it fails?"
    why: "The waiting time names the layer. Traefik (v3.6 here, no timeout flags set) waits up to 30 s to connect to a pod (forwardingTimeouts.dialTimeout) and, by default, without limit for the answer. So a 504 after about 30 s means the connection itself never opened: packets are dropped (a NetworkPolicy, a routing problem). A 504 after a timeout you configured means the app accepted but answered too slowly. Replace the host with the failing one; the command only sends a GET."
    command: "curl -s -o /dev/null -m 70 -w '%{http_code} connect=%{time_connect}s total=%{time_total}s\\n' -H 'Host: flask-vue.albertycliu.xyz' http://$(kubectl -n kube-system get svc traefik -o jsonpath='{.status.loadBalancer.ingress[0].ip}')/api/hello"
    good: "200 well under a second: the route works now; watch for slow periods (step 5)."
    bad: "504 after about 30 s: go to step 3 (dropped connections). 504 after your own timeout: go to step 4 (a slow app)."
  - title: "Which Service answers, and is it ready?"
    why: "A timeout needs an endpoint that exists but does not answer. Confirm the failing host and path lead to the Service you think, and that it has ready endpoints. With no endpoints Traefik answers 503 at once, not 504."
    command: "kubectl -n <ns> get ingressroute -o wide; kubectl -n <ns> get endpointslices -l kubernetes.io/service-name=<svc>"
    kubemap: "app-map"
    check: {op: "service.check", args: {namespace: "$ns", service: "$svc"}}
    good: "Ready endpoints: the Service is fine, so the problem is on the way to the pod or in the pod."
    bad: "No ready endpoints: that is a 503 story (see traffic-503)."
  - title: "Does a NetworkPolicy drop the traffic from Traefik to the pods?"
    why: "A NetworkPolicy does not refuse a connection, it drops the packets, so Traefik waits for its dial timeout and answers 504. On this cluster sre-lab-app has default-deny-ingress; flask-vue-backend is reachable only because allow-traefik-to-flask-vue-backend lets kube-system/traefik in on port 5000. Remove that policy, or change the port, and /api turns into a 30-second 504."
    command: "kubectl -n <ns> get networkpolicy; kubectl -n <ns> describe networkpolicy"
    kubemap: "netpol"
    check: {op: "netpol.check", args: {fromNamespace: "$fromns", fromPod: "$from", toNamespace: "$ns", toService: "$svc", port: "$port"}}
    good: "Allowed: the check shows the rule that lets the ingress controller in."
    bad: "Blocked: the check names the isolating policy. Add an ingress rule for the ingress controller's namespace and pods on the target port."
  - title: "Is the app too slow: throttled, starved, or waiting on a dependency?"
    why: "If the connection opens but the answer is late, the pod is slow. A CPU limit that the app keeps hitting throttles it; a slow database, an exhausted connection pool (url-shortener goes through PgBouncer) or a lock makes every request wait. The pod's checklist shows usage against limits and the dependencies it calls."
    command: "kubectl -n <ns> top pod <pod> --containers; kubectl -n <ns> logs <pod> --since=15m | tail -50"
    kubemap: "debug"
    check: {op: "pod.debug", args: {namespace: "$ns", pod: "$pod"}}
    good: "CPU and memory well under the limits, and the dependencies are healthy."
    bad: "At the CPU limit: raise it or remove it; a dependency slow or unhealthy: follow it on the app map (step 5)."
  - title: "Are the app's dependencies healthy?"
    why: "A 504 at the edge is often a slow database or cache deeper down. The app map shows which Services the app names in its configuration (url-shortener → url-shortener-pooler → url-shortener-db, and → redis-master) and their health."
    command: "kubectl -n <ns> get pods -o wide; kubectl -n <ns> get endpointslices"
    kubemap: "app-map"
    check: {op: "appmap", args: {namespace: "$ns"}}
    good: "Every dependency is healthy with ready endpoints."
    bad: "A database, pooler or cache is unhealthy: debug that component first; the 504 is its symptom."
  - title: "Is the node starved for CPU or memory?"
    why: "When a node is short of CPU, every pod on it answers slowly, and 504s appear across apps. Kubernetes has no CPU pressure condition, so it reports all clear; the kernel's pressure stall information shows the waiting. On the lab cluster (k8server, measured on 2026-09-28) tasks waited for CPU about 27% of the time."
    command: "kubectl describe node <node> | grep -A8 Conditions; kubectl top node"
    kubemap: "node"
    check: {op: "node.pressure", args: {node: "$node"}}
    good: "No CPU, memory or I/O pressure."
    bad: "CPU or memory pressure: move load, add capacity, or lower the noisiest pods' limits."
causes:
  - cause: "A NetworkPolicy drops the traffic from the ingress controller (packets dropped, so Traefik waits 30 s)."
    fix: "Add an ingress rule for the ingress controller's namespace and pods on the target port."
    prove: "curl -s -o /dev/null -w '%{http_code} %{time_total}s\\n' -H 'Host: flask-vue.albertycliu.xyz' http://192.168.32.240/api/hello   # 200 in milliseconds"
  - cause: "The app is throttled at its CPU limit."
    fix: "Raise or remove the CPU limit (keep the request); profile the slow endpoint."
    prove: "kubectl -n <ns> top pod <pod> --containers   # well under the limit under load"
  - cause: "A dependency is slow (database, pooler out of connections, cache)."
    fix: "Fix the dependency; set client timeouts shorter than the ingress timeout so the app fails fast with a clear error."
    prove: "The dependency's own checks are green, and the app's latency drops."
  - cause: "The node is starved for CPU or memory."
    fix: "Spread the load, add a node, or cap the noisy neighbour."
    prove: "The node's CPU pressure falls below 10%."
  - cause: "A pod IP collides with a LAN address (this cluster's Calico pool 192.168.0.0/16 overlaps the home network 192.168.32.0/24)."
    fix: "Move pods to a pool that does not overlap the LAN (a planned change)."
    prove: "kubectl get pods -A -o custom-columns='NS:.metadata.namespace,POD:.metadata.name,IP:.status.podIP,HOSTNET:.spec.hostNetwork' | awk '$3 ~ /^192\\.168\\.32\\./ && $4 != \"true\"'   # prints nothing; host-network pods show the node's IP and are left out"
prevention:
  - "Explicit timeouts on every hop, shortest at the bottom: database < app < ingress < client"
  - "A NetworkPolicy change reviewed with a check from the ingress controller to every public Service"
  - "CPU requests sized from real usage, and CPU limits only where they are really needed"
  - "Traefik access logs with durations (they are off on this cluster)"
senior:
  - "Timing is the first clue: 30 s means the connection never opened; your own timeout means a slow answer; milliseconds means it is not a timeout at all."
  - "Blast radius: one route (a policy or the app) against every app on a node (node pressure) against everything (the ingress or DNS)."
  - "SLO impact: a 504 costs the user the full wait. Latency SLOs catch the slow period before the timeouts start."
  - "Mitigate: shed load, roll back, or scale out; do not raise the ingress timeout first, that only makes users wait longer."
  - "What I would automate: synthetic checks per route with a latency budget, and a CI check that the ingress controller can reach every public Service after a policy change."
  - "Trade-off: a shorter timeout fails faster and frees resources, but turns slow requests into errors; set it from the p99 you promise."
lab: "kubemap-demo/netpol"
