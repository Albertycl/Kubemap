# The first scenario (KM-82). Placeholders: <ns> and $ns in commands and
# check arguments are filled in when the scenario is started from a real
# object (an app, a route or a Service on the app map).
id: traffic-503
area: traffic
title: "Users get HTTP 503"
question: "The site returns 503 Service Unavailable. What do you do?"
symptoms:
  - "503 Service Unavailable from Traefik, often with the text 'no available server'"
  - "Some or all requests to one host or path fail, others work"
  - "It started after a deploy, a config change, or a node problem"
steps:
  - title: "Which route fails, and which Service does it send traffic to?"
    why: "A 503 from the ingress means the route exists but has nowhere to send the request. Start from the route, so you debug the Service that is really behind the failing host and path, not the one you think."
    command: "kubectl -n <ns> get ingressroute,ingress -o wide"
    kubemap: "app-map"
    check: {op: "appmap", args: {namespace: "$ns"}}
    good: "Every route in the namespace points to a Service with ready endpoints."
    bad: "A route points to a missing Service or to one with no ready endpoints: that is your 503. Continue with that Service."
  - title: "Does the Service have ready endpoints?"
    why: "Traefik sends traffic only to ready endpoints. With zero ready endpoints it answers 503 at once. This one check splits the problem in two: no endpoints (a Service or pod problem) or endpoints present (look at the network or the app)."
    command: "kubectl -n <ns> get endpointslices -l kubernetes.io/service-name=<svc>"
    kubemap: "app-map"
    check: {op: "service.check", args: {namespace: "$ns", service: "$svc"}}
    good: "At least one ready address, and its ports lead somewhere."
    bad: "No ready addresses: go on with the next steps to find out why."
  - title: "Do the Service's selector and ports match the pods?"
    why: "A selector that no pod matches (a typo, a renamed label after a Helm upgrade) or a targetPort the container does not listen on gives no endpoints, or endpoints that refuse connections, while every pod looks healthy."
    command: "kubectl -n <ns> get service <svc> -o jsonpath='{.spec.selector}{\"\\n\"}{.spec.ports}'; kubectl -n <ns> get pods --show-labels"
    kubemap: "app-map"
    good: "The selector matches the app's pods, and targetPort is a port the container declares."
    bad: "No pod has all the selector's labels, or targetPort names a port the container does not have: fix the Service or the pod template."
  - title: "Why are the pods not ready?"
    why: "When the selector matches but nothing is ready, the pods are the problem: crash-looping, killed for memory, failing their readiness probe, or not scheduled. Read the pod's status, events and logs before changing anything."
    command: "kubectl -n <ns> get pods -o wide; kubectl -n <ns> describe pod <pod>; kubectl -n <ns> logs <pod> --previous"
    kubemap: "debug"
    check: {op: "pod.debug", args: {namespace: "$ns", pod: "$pod"}}
    good: "The pod is Running and ready, with no warning events."
    bad: "The checklist names the cause (exit code, OOMKilled, probe failure, Pending): fix that first."
  - title: "Does a NetworkPolicy block traffic from the ingress to the pods?"
    why: "If endpoints are ready but requests time out or fail, a NetworkPolicy can isolate the pods so only some namespaces may connect. Traefik runs in its own namespace, so a policy that forgets it breaks the site while every pod is healthy."
    command: "kubectl -n <ns> get networkpolicy; kubectl -n <ns> describe networkpolicy"
    kubemap: "netpol"
    check: {op: "netpol.check", args: {fromNamespace: "$fromns", fromPod: "$from", toNamespace: "$ns", toService: "$svc", port: "$port"}}
    good: "Traffic from the Traefik pod to the Service's port is allowed."
    bad: "Blocked: the check names the policy that isolates the pods; add an ingress rule for the ingress controller's namespace."
  - title: "Is a node under pressure, evicting or not scheduling the pods?"
    why: "Memory or disk pressure makes the kubelet evict pods, and a full node leaves new pods Pending. Then several apps fail at once. The blast radius tells you it is the node, not the app."
    command: "kubectl get nodes; kubectl describe node <node> | grep -A8 Conditions; kubectl get pods -A --field-selector=status.phase=Failed"
    kubemap: "node"
    check: {op: "node.pressure"}
    good: "Every node is Ready, with no memory, disk or PID pressure."
    bad: "A node is under pressure or NotReady: free resources or move pods, then come back to the Service."
  - title: "What does the ingress controller itself say?"
    why: "Traefik logs which router and service answered 503 and why (no servers, a missing Service, a middleware error). It confirms the root cause and shows whether other routes fail too. Only with its access log on: on this cluster it is off, so this finds nothing and the status code and timing from curl are the evidence (a 503 comes back in about a millisecond)."
    command: "kubectl -n kube-system logs deploy/traefik --since=15m | grep -E ' 503 |no available server' | tail -20"
    kubemap: "logs"
    good: "No 503s for this route since the fix."
    bad: "503s keep coming: compare the router and service names in the log with the route from step 1."
causes:
  - cause: "The readiness probe fails (the app is up but a dependency is down, or the probe path or port is wrong)."
    fix: "Fix the dependency or the probe. A readiness probe should check what this pod can fix itself, not every dependency."
    prove: "kubectl -n <ns> get endpointslices -l kubernetes.io/service-name=<svc>   # ready addresses back"
  - cause: "The Service selector matches no pod (a typo, or labels changed in a new release)."
    fix: "Make the Service selector and the pod template labels agree."
    prove: "kubectl -n <ns> get pods -l <selector>   # the app's pods are listed"
  - cause: "targetPort points to a port the container does not listen on."
    fix: "Set targetPort to the container port (by name is safest)."
    prove: "kubectl -n <ns> get endpointslices -l kubernetes.io/service-name=<svc> -o jsonpath='{.items[*].ports}'"
  - cause: "All pods crash or were killed for memory (CrashLoopBackOff, exit 137)."
    fix: "Read the previous logs and the exit code; raise the memory limit only if usage is really that high."
    prove: "kubectl -n <ns> get pods   # Running, ready, restarts no longer rising"
  - cause: "A NetworkPolicy blocks the ingress controller's namespace."
    fix: "Add an ingress rule allowing the ingress controller's namespace to the pods' port."
    prove: "curl -sS -o /dev/null -w '%{http_code}\\n' https://<host>/   # 200"
  - cause: "A rollout took every pod down at once, or a node was drained with no PodDisruptionBudget."
    fix: "Roll back or wait for the new pods; add a PodDisruptionBudget and maxUnavailable below 100%."
    prove: "kubectl -n <ns> rollout status deployment/<deploy>"
prevention:
  - "Readiness probes that check the pod itself; liveness probes that do not restart pods for a slow dependency"
  - "A PodDisruptionBudget and a rolling update with maxUnavailable below 100% for every public app"
  - "Alerts on 'Service with zero ready endpoints' and on the ingress 5xx rate, not only on pod restarts"
  - "Label and selector changes reviewed together; a test that the Service selects the pods in CI"
senior:
  - "Blast radius first: one route, one app, or everything behind the ingress? Everything points at the ingress or a node, one route at the app."
  - "SLO impact: a 503 is a hard error and counts fully against the error budget; say how long and how much traffic."
  - "Mitigate, then fix: roll back the last change if the timing matches, and find the root cause after users are served again."
  - "What I would automate: a synthetic check per public route, and an alert when a Service has zero ready endpoints for a minute."
lab: "kubemap-demo/readiness503"
