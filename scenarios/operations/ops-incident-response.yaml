# KM-88. Placeholders: <ns> and $ns. The worked example is the real
# 28 Sep 2026 disk-pressure incident (docs/incidents/2026-09-28-disk-pressure.md).
id: ops-incident-response
area: operations
title: "Running an incident: SLOs, roles, timeline and the postmortem"
question: "Several apps are down and people are asking what is going on. How do you run the incident from first alert to postmortem?"
symptoms:
  - "An alert or a user report that something important is broken"
  - "Many people looking at different dashboards, nobody sure who decides"
  - "Later: the same kind of outage happens again"
steps:
  - title: "Declare it: is this an incident, and how bad?"
    why: "An incident starts when an SLO is at risk, not when the cause is known. Declaring early costs little; declaring late costs the error budget. Severity follows user impact: how many users, which functions, for how long. On 28 Sep every app on k8server was down for about 40 minutes: a full outage."
    command: "kubectl get nodes; kubectl get pods -A --no-headers | grep -vcE 'Running|Completed'   # a first view of the blast radius"
    kubemap: "findings"
    check: {op: "health.check"}
    good: "Impact is small and contained: handle it as a normal ticket."
    bad: "Users are affected: declare an incident, pick a severity, open a channel and a timeline."
  - title: "Assign roles"
    why: "One incident commander decides and keeps the timeline; others investigate or talk to users. Without a commander, three people change things at once and nobody knows which change fixed or broke what."
    command: "# no kubectl: write in the incident channel who is the commander, who investigates, who communicates"
    kubemap: "findings"
    good: "Named roles, one person deciding."
    bad: "Everyone debugging, nobody deciding or writing things down."
  - title: "Mitigate first, root cause later"
    why: "The first goal is to stop the user impact: roll back, fail over, scale, free space, disable a feature. On 28 Sep the mitigation was to free disk (Go cache 7.4 GB, Docker cache 12.2 GB) so the kubelet stopped evicting; the root cause (build caches on the node's disk) was fixed after."
    command: "kubectl -n <ns> get events --sort-by=.lastTimestamp | tail -20   # what changed just before the impact"
    kubemap: "findings"
    check: {op: "health.check", args: {namespace: "$ns"}}
    good: "A mitigation that restores service is applied and verified."
    bad: "Still hunting for the root cause while users are down: stop and pick the safest mitigation."
  - title: "Keep a timeline as you go"
    why: "A timeline written during the incident (time, what was seen, what was done, by whom) is the base of the postmortem and stops people repeating the same checks. Kubemap drafts one from the problem finder's findings (KM-90); people add the actions and decisions."
    command: "kubectl get events -A --sort-by=.lastTimestamp | tail -30; journalctl -u k3s --since -1h | grep -E 'eviction_manager|image_gc_manager' | tail   # on the node: the kubelet's own timeline"
    kubemap: "findings"
    good: "Every action has a time and a name in the timeline."
    bad: "Actions nobody wrote down: reconstruct them now, while memory is fresh."
  - title: "Confirm recovery against the SLO"
    why: "The incident ends when the user-facing SLI is back within its objective, not when one pod turns green. On 28 Sep DiskPressure cleared at 07:49, but url-shortener only ran again at 08:12 (its image had been deleted): the incident lasted until 08:12."
    command: "kubectl get pods -A --no-headers | grep -vE 'Running|Completed'; kubectl get deploy -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,READY:.status.readyReplicas,WANT:.spec.replicas | awk 'NR==1 || $3!=$4'"
    kubemap: "app-map"
    check: {op: "appmap"}
    good: "Every app ready and the SLI (success rate, latency) back to normal for some time."
    bad: "Something is still broken or degraded: the incident is not over."
  - title: "Write the postmortem, blameless"
    why: "A postmortem explains how the system allowed the failure, not who pressed the key: summary, impact (duration, users, error budget spent), timeline, root cause and contributing factors, what went well, what went badly, and follow-ups with an owner and a date. The 28 Sep write-up is an example."
    command: "# docs/incidents/2026-09-28-disk-pressure.md; Kubemap's incident journal (KM-89) holds the draft, decisions and follow-ups"
    kubemap: "findings"
    good: "Every follow-up has an owner and a date, and is tracked to done."
    bad: "Follow-ups without owners: the incident will happen again."
causes:
  - cause: "No clear commander, so actions conflict and nobody decides."
    fix: "Name an incident commander at the start of every incident."
    prove: "The timeline names the commander in its first line"
  - cause: "Time spent on root cause while users were down."
    fix: "Mitigate first (rollback, failover, free resources), then investigate."
    prove: "Time to mitigate is shorter than time to root cause in the postmortem"
  - cause: "Recovery declared too early (a condition cleared, users still affected)."
    fix: "Declare the end only when the SLI is back within the SLO."
    prove: "The SLO dashboard shows normal for the agreed time"
  - cause: "Follow-ups without owners, so the same incident repeats."
    fix: "Every follow-up gets an owner and a date, reviewed weekly."
    prove: "The follow-up list has no item without owner and date"
prevention:
  - "SLOs for each user-facing service, with error budgets people look at"
  - "An on-call rotation and a written incident process (severity levels, roles, channel)"
  - "Alerts on symptoms users feel (error rate, latency), with causes linked from the alert"
  - "A postmortem for every user-facing incident, reviewed together; follow-ups tracked"
senior:
  - "I declare early, name a commander, and mitigate before I explain."
  - "SLOs decide severity and when the incident ends: 'the node is Ready' is not the same as 'users are served'."
  - "The 28 Sep incident: 40 minutes of full outage, root cause build caches on the node's disk, the kubelet evicting until 15 % free, and an image lost for good. Follow-ups: a disk check before builds, a registry for every image, disk alerts before the threshold."
  - "Blameless does not mean no accountability: it means fixing the system that allowed the mistake."
